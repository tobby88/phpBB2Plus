name: PHP syntax compatibility

on:
  push:
    branches:
      - main
    paths:
      - "phpBB2/**/*.php"
      - "phpBB2/**/*.tpl"
      - "phpBB2/**/*.js"
      - "phpBB2/**/*.css"
      - "phpBB2/install/schemas/*.sql"
      - "update/**/*.php"
      - ".github/scripts/*.php"
      - ".github/fixtures/**/*.php"
      - ".github/scripts/*.js"
      - ".github/workflows/php-lint.yml"
  pull_request:
    paths:
      - "phpBB2/**/*.php"
      - "phpBB2/**/*.tpl"
      - "phpBB2/**/*.js"
      - "phpBB2/**/*.css"
      - "phpBB2/install/schemas/*.sql"
      - "update/**/*.php"
      - ".github/scripts/*.php"
      - ".github/fixtures/**/*.php"
      - ".github/scripts/*.js"
      - ".github/workflows/php-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "5.6"
          - "7.4"
          - "8.5"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_sqlite

      - name: Lint PHP sources
        shell: bash
        run: find phpBB2 update -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test database update schema
        run: php update/update_from_153a.php --self-test

      - name: Check public security bootstrap
        shell: bash
        run: |
          missing=0
          for file in phpBB2/*.php; do
            if grep -Eq "define[[:space:]]*\\([[:space:]]*['\"]IN_PHPBB" "$file" \
              && ! grep -Fq "common." "$file" \
              && ! grep -Fq "PHPBB_STANDALONE_VALIDATED" "$file"; then
              echo "Public entry point bypasses common.php: $file"
              missing=1
            fi
          done
          exit "$missing"

      - name: Audit public security bootstrap boundaries
        run: php .github/scripts/check-public-security-bootstrap.php

      - name: Audit ACP integrations
        run: php .github/scripts/check-acp-integration.php

      - name: Test directory iteration safety
        run: php .github/scripts/check-directory-iteration-safety.php

      - name: Test CrackerTracker user functions
        run: php .github/scripts/check-ctracker-userfunctions.php

      - name: Test CrackerTracker configuration resilience
        run: php .github/scripts/check-ctracker-config-resilience.php

      - name: Test CrackerTracker request limiter
        run: php .github/scripts/check-ctracker-request-limiter.php

      - name: Test CrackerTracker endpoint routing parity
        run: php .github/scripts/check-ctracker-routing.php

      - name: Test CrackerTracker request security
        run: php .github/scripts/check-ctracker-security.php

      - name: Test CrackerTracker regex failures and text arrays
        run: php .github/scripts/check-ctracker-security-errors.php

      - name: Test CrackerTracker log redaction failures
        run: php .github/scripts/check-ctracker-log-redaction-errors.php

      - name: Test apex and www host aliases
        run: php .github/scripts/check-host-alias-safety.php

      - name: Test CrackerTracker blocklist matching
        run: php .github/scripts/check-ctracker-ipblocker.php

