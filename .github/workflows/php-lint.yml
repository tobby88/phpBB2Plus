name: PHP syntax compatibility

on:
  push:
    branches:
      - main
    paths:
      - "phpBB2/**/*.php"
      - "phpBB2/install/schemas/*.sql"
      - "update/**/*.php"
      - ".github/scripts/*.php"
      - ".github/workflows/php-lint.yml"
  pull_request:
    paths:
      - "phpBB2/**/*.php"
      - "phpBB2/install/schemas/*.sql"
      - "update/**/*.php"
      - ".github/scripts/*.php"
      - ".github/workflows/php-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "5.6"
          - "7.4"
          - "8.5"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP sources
        shell: bash
        run: find phpBB2 update -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test database update schema
        run: php update/update_from_153a.php --self-test

      - name: Check public security bootstrap
        shell: bash
        run: |
          missing=0
          for file in phpBB2/*.php; do
            if grep -Eq "define[[:space:]]*\\([[:space:]]*['\"]IN_PHPBB" "$file" \
              && ! grep -Fq "common." "$file" \
              && ! grep -Fq "PHPBB_STANDALONE_VALIDATED" "$file"; then
              echo "Public entry point bypasses common.php: $file"
              missing=1
            fi
          done
          exit "$missing"

      - name: Audit ACP integrations
        run: php .github/scripts/check-acp-integration.php

      - name: Test CrackerTracker user functions
        run: php .github/scripts/check-ctracker-userfunctions.php

      - name: Test CrackerTracker request limiter
        run: php .github/scripts/check-ctracker-request-limiter.php

      - name: Test CrackerTracker request security
        run: php .github/scripts/check-ctracker-security.php

      - name: Test CrackerTracker blocklist matching
        run: php .github/scripts/check-ctracker-ipblocker.php

      - name: Test login abuse protections
        run: php .github/scripts/check-login-protection.php

      - name: Test CrackerTracker log rotation
        run: php .github/scripts/check-ctracker-log-manager.php

      - name: Test CrackerTracker integrity checksums
        run: php .github/scripts/check-ctracker-checksums.php

      - name: Test CrackerTracker file scanner
        run: php .github/scripts/check-ctracker-file-scanner.php

      - name: Test CrackerTracker configuration recovery
        run: php .github/scripts/check-ctracker-recovery.php

      - name: Test personal-album category safety
        run: php .github/scripts/check-album-personal-safety.php

      - name: Test session-page constants
        run: php .github/scripts/check-session-page-constants.php

      - name: Test Knowledge Base runtime safety
        run: php .github/scripts/check-kb-runtime-safety.php

      - name: Test paFileDB administration safety
        run: php .github/scripts/check-pafiledb-admin-safety.php

      - name: Test Arcade position safety
        run: php .github/scripts/check-arcade-position-safety.php

      - name: Test Knowledge Base structure administration safety
        run: php .github/scripts/check-kb-admin-structure-safety.php

      - name: Test database maintenance safety
        run: php .github/scripts/check-db-maintenance-safety.php

      - name: Test forum administration safety
        run: php .github/scripts/check-forum-admin-safety.php

      - name: Test style administration safety
        run: php .github/scripts/check-style-admin-safety.php

      - name: Test ColorGroups administration safety
        run: php .github/scripts/check-color-groups-admin-safety.php

      - name: Test database backup and restore safety
        run: php .github/scripts/check-db-utilities-safety.php

      - name: Test link administration safety
        run: php .github/scripts/check-links-admin-safety.php
