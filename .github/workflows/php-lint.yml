name: PHP syntax compatibility

on:
  push:
    branches:
      - main
    paths:
      - "phpBB2/**/*.php"
      - ".github/workflows/php-lint.yml"
  pull_request:
    paths:
      - "phpBB2/**/*.php"
      - ".github/workflows/php-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "5.6"
          - "7.4"
          - "8.5"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP sources
        shell: bash
        run: find phpBB2 -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check public security bootstrap
        shell: bash
        run: |
          missing=0
          for file in phpBB2/*.php; do
            if grep -Eq "define[[:space:]]*\\([[:space:]]*['\"]IN_PHPBB" "$file" \
              && ! grep -Fq "common." "$file" \
              && ! grep -Fq "PHPBB_STANDALONE_VALIDATED" "$file"; then
              echo "Public entry point bypasses common.php: $file"
              missing=1
            fi
          done
          exit "$missing"
