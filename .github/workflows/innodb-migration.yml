name: Native InnoDB migration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  migration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '7.4', '8.5']
    services:
      database:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pfixture-only"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql, pdo_sqlite, openssl
          coverage: none
      - run: php .github/scripts/check-innodb-migration.php
        env:
          PHPBB_STORAGE_NATIVE: '1'
          PHPBB_STORAGE_PASSWORD: fixture-only
      - run: php .github/scripts/check-storage-policy.php
        env:
          PHPBB_STORAGE_NATIVE: '1'
          PHPBB_STORAGE_PASSWORD: fixture-only
      - run: php .github/scripts/run-native-rebuild-session.php
        env:
          PHPBB_REBUILD_NATIVE: '1'
          PHPBB_REBUILD_TEST_PASSWORD: fixture-only
      - run: php .github/scripts/run-native-poll-session.php
        env:
          PHPBB_POLL_MAINTENANCE_NATIVE: '1'
          PHPBB_POLL_MAINTENANCE_TEST_PASSWORD: fixture-only
      - run: |
          php .github/scripts/run-native-pm-maintenance.php counter
          php .github/scripts/run-native-pm-maintenance.php repair
        env:
          PHPBB_PM_MAINTENANCE_NATIVE: '1'
          PHPBB_PM_MAINTENANCE_TEST_PASSWORD: fixture-only
      - run: php .github/scripts/run-native-acl-session.php
        env:
          PHPBB_ACL_SESSION_NATIVE: '1'
          PHPBB_ACL_SESSION_TEST_PASSWORD: fixture-only
      - run: php .github/scripts/check-ctracker-rate-storage.php
        env:
          PHPBB_RATE_NATIVE: '1'
          PHPBB_RATE_TEST_PASSWORD: fixture-only
      - run: |
          php .github/scripts/check-ctracker-recovery-storage.php
          php .github/scripts/check-ctracker-admin-authority.php
        env:
          PHPBB_CT_RECOVERY_NATIVE: '1'
          PHPBB_CT_RECOVERY_TEST_PASSWORD: fixture-only
