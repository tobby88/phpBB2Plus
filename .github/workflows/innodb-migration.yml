name: Native InnoDB migration
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'phpBB2/templates/**/*.tpl'
      - 'phpBB2/templates/**/*.css'
      - 'phpBB2/templates/**/images/**/*.gif'
      - 'phpBB2/templates/**/images/**/*.png'
      - 'phpBB2/templates/**/images/**/*.jpg'
      - 'phpBB2/templates/**/images/**/*.jpeg'
      - 'phpBB2/templates/**/images/**/*.svg'
      - 'phpBB2/templates/**/images/**/*.webp'
      - 'phpBB2/templates/**/images/**/*.ico'
      - 'phpBB2/includes/bbcode.php'
      - '.github/scripts/check-bbcode-safety.php'
      - '.github/scripts/check-bbcode-failure-runtime.php'
      - '.github/scripts/check-bbcode-template-runtime.php'
      - '.github/scripts/check-container-bbcode-runtime.php'
      - '.github/scripts/check-table-bbcode-runtime.php'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'phpBB2/templates/**/*.tpl'
      - 'phpBB2/templates/**/*.css'
      - 'phpBB2/templates/**/images/**/*.gif'
      - 'phpBB2/templates/**/images/**/*.png'
      - 'phpBB2/templates/**/images/**/*.jpg'
      - 'phpBB2/templates/**/images/**/*.jpeg'
      - 'phpBB2/templates/**/images/**/*.svg'
      - 'phpBB2/templates/**/images/**/*.webp'
      - 'phpBB2/templates/**/images/**/*.ico'
      - 'phpBB2/includes/bbcode.php'
      - '.github/scripts/check-bbcode-safety.php'
      - '.github/scripts/check-bbcode-failure-runtime.php'
      - '.github/scripts/check-bbcode-template-runtime.php'
      - '.github/scripts/check-container-bbcode-runtime.php'
      - '.github/scripts/check-table-bbcode-runtime.php'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  migration:
    name: migration (${{ matrix.php }}, part ${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '7.4', '8.5']
        part: [1, 2, 3, 4]
    services:
      database:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pfixture-only"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql, pdo_sqlite, openssl, ftp, gd
          coverage: none
      - name: Check recommendation mail delivery authority, throttling and Unicode
        if: matrix.part == 2
        run: |
          php .github/scripts/check-pafiledb-mail-native.php
          php .github/scripts/check-pafiledb-mail-native.php legacy
          php .github/scripts/check-board-mail-native.php
          php .github/scripts/check-board-mail-native.php legacy
        env:
          PHPBB_PA_MAIL_NATIVE: '1'
          PHPBB_PA_MAIL_PASSWORD: fixture-only
          PHPBB_BOARD_MAIL_NATIVE: '1'
          PHPBB_BOARD_MAIL_PASSWORD: fixture-only
      - name: Check real native fixture conflict behavior
        if: matrix.part == 2
        run: php .github/scripts/check-native-fixture-locks.php
        env:
          PHPBB_FIXTURE_LOCKS_NATIVE: '1'
          PHPBB_FIXTURE_LOCKS_PASSWORD: fixture-only
      - name: Respect discussion forum access in Knowledge Base comments
        if: matrix.part == 2
        run: |
          php .github/scripts/check-kb-comment-visibility-native.php
          php .github/scripts/check-kb-comment-retention-native.php
        env:
          PHPBB_KB_COUNTER_NATIVE: '1'
          PHPBB_KB_COUNTER_PASSWORD: fixture-only
      - name: Check native Album owner identities and personal gallery guards
        if: matrix.part == 1
        run: |
          php .github/scripts/check-album-owner-identity-native.php
          php .github/scripts/check-album-root-text-native.php
          php .github/scripts/check-album-creation-guard-native.php
          php .github/scripts/check-album-root-transaction-native.php
          php .github/scripts/check-album-root-authority-native.php
          php .github/scripts/check-album-category-text-native.php
          php .github/scripts/check-album-text-migration-native.php
          php .github/scripts/check-album-category-authority-native.php
          php .github/scripts/check-album-category-edit-native.php
          php .github/scripts/check-album-photo-text.php
          php .github/scripts/check-album-photo-edit-native.php
          php .github/scripts/check-album-photo-migration-native.php
          php .github/scripts/check-album-discussion-migration-native.php
          php .github/scripts/check-album-discussion-native.php
          PHPBB_ALBUM_DISCUSSION_PART=cache php .github/scripts/check-album-discussion-native.php
        env:
          PHPBB_ALBUM_OWNER_NATIVE: '1'
          PHPBB_ALBUM_OWNER_PASSWORD: fixture-only
          PHPBB_ALBUM_ROOT_NATIVE: '1'
          PHPBB_ALBUM_ROOT_PASSWORD: fixture-only
          PHPBB_ALBUM_CREATION_NATIVE: '1'
          PHPBB_ALBUM_CREATION_PASSWORD: fixture-only
          PHPBB_ALBUM_TRANSACTION_NATIVE: '1'
          PHPBB_ALBUM_TRANSACTION_PASSWORD: fixture-only
          PHPBB_ALBUM_AUTHORITY_NATIVE: '1'
          PHPBB_ALBUM_AUTHORITY_PASSWORD: fixture-only
          PHPBB_ALBUM_CATEGORY_TEXT_NATIVE: '1'
          PHPBB_ALBUM_CATEGORY_TEXT_PASSWORD: fixture-only
          PHPBB_ALBUM_CATEGORY_NATIVE: '1'
          PHPBB_ALBUM_CATEGORY_PASSWORD: fixture-only
          PHPBB_ALBUM_CATEGORY_EDIT_NATIVE: '1'
          PHPBB_ALBUM_CATEGORY_EDIT_PASSWORD: fixture-only
          PHPBB_ALBUM_PHOTO_INPUT_NATIVE: '1'
          PHPBB_ALBUM_PHOTO_INPUT_PASSWORD: fixture-only
          PHPBB_ALBUM_PHOTO_EDIT_NATIVE: '1'
          PHPBB_ALBUM_PHOTO_EDIT_PASSWORD: fixture-only
          PHPBB_ALBUM_PHOTO_TEXT_NATIVE: '1'
          PHPBB_ALBUM_PHOTO_TEXT_PASSWORD: fixture-only
          PHPBB_ALBUM_DISCUSSION_TEXT_NATIVE: '1'
          PHPBB_ALBUM_DISCUSSION_TEXT_PASSWORD: fixture-only
          PHPBB_ALBUM_DISCUSSION_NATIVE: '1'
          PHPBB_ALBUM_DISCUSSION_PASSWORD: fixture-only
      - name: Preserve full HotOrNot score capacity and historical votes
        if: matrix.part == 3
        run: php .github/scripts/check-album-rating-storage-native.php
        env:
          PHPBB_ALBUM_RATING_STORAGE_NATIVE: '1'
          PHPBB_ALBUM_RATING_STORAGE_PASSWORD: fixture-only
      - name: Reconcile Album comment categories without changing content
        if: matrix.part == 3
        run: php -d memory_limit=64M .github/scripts/check-album-comment-parents-native.php
        env:
          PHPBB_ALBUM_COMMENT_PARENTS_NATIVE: '1'
          PHPBB_ALBUM_COMMENT_PARENTS_CLI: '1'
          PHPBB_ALBUM_COMMENT_PARENTS_PASSWORD: fixture-only
      - name: Check Album file journal schema and real updater preservation
        if: matrix.part == 1
        run: |
          php .github/scripts/check-album-file-journal-native.php
          php .github/scripts/check-album-file-coordinator-native.php
          php .github/scripts/check-album-upload-receipt-native.php
          PHPBB_ALBUM_UPLOAD_RECEIPT_PART=recovery php .github/scripts/check-album-upload-receipt-native.php
          php .github/scripts/check-album-lifecycle-authority-native.php
          PHPBB_ALBUM_AUTHORITY_PART=category-write php .github/scripts/check-album-lifecycle-authority-native.php
          php .github/scripts/check-album-cache-maintenance-native.php
          php .github/scripts/check-album-picture-upload-native.php
          php .github/scripts/check-album-picture-delete-native.php
          PHPBB_ALBUM_DELETE_PART=recovery php .github/scripts/check-album-picture-delete-native.php
          PHPBB_ALBUM_DELETE_PART=bulk-unique php -d memory_limit=64M .github/scripts/check-album-picture-delete-native.php
          PHPBB_ALBUM_DELETE_PART=bulk-shared php -d memory_limit=64M .github/scripts/check-album-picture-delete-native.php
          php .github/scripts/check-album-file-recovery-native.php
        env:
          PHPBB_ALBUM_FILE_JOURNAL_NATIVE: '1'
          PHPBB_ALBUM_FILE_JOURNAL_PASSWORD: fixture-only
          PHPBB_ALBUM_FILE_COORDINATOR_NATIVE: '1'
          PHPBB_ALBUM_FILE_COORDINATOR_PASSWORD: fixture-only
          PHPBB_ALBUM_UPLOAD_RECEIPT_NATIVE: '1'
          PHPBB_ALBUM_UPLOAD_RECEIPT_PASSWORD: fixture-only
          PHPBB_ALBUM_LIFECYCLE_AUTHORITY_NATIVE: '1'
          PHPBB_ALBUM_LIFECYCLE_AUTHORITY_PASSWORD: fixture-only
          PHPBB_ALBUM_CACHE_MAINTENANCE_NATIVE: '1'
          PHPBB_ALBUM_CACHE_MAINTENANCE_PASSWORD: fixture-only
          PHPBB_ALBUM_PICTURE_UPLOAD_NATIVE: '1'
          PHPBB_ALBUM_PICTURE_UPLOAD_PASSWORD: fixture-only
          PHPBB_ALBUM_PICTURE_DELETE_NATIVE: '1'
          PHPBB_ALBUM_PICTURE_DELETE_PASSWORD: fixture-only
          PHPBB_ALBUM_RECOVERY_NATIVE: '1'
          PHPBB_ALBUM_RECOVERY_PASSWORD: fixture-only
      - name: Check native ACP rank authority and paired updates
        if: matrix.part == 4
        run: php .github/scripts/check-ranks-native.php
        env:
          PHPBB_RANKS_NATIVE: '1'
          PHPBB_RANKS_PASSWORD: fixture-only
      - name: Check native word and acronym administration
        if: matrix.part == 2
        run: |
          php .github/scripts/check-content-rendering.php
          php .github/scripts/check-content-admin-native.php
          PHPBB_CONTENT_RAW=1 php .github/scripts/check-content-admin-native.php
        env:
          PHPBB_CONTENT_NATIVE: '1'
          PHPBB_CONTENT_PASSWORD: fixture-only
      - name: Check native username restriction administration
        if: matrix.part == 4
        run: |
          php .github/scripts/check-disallow-native.php
          PHPBB_DISALLOW_RAW=1 php .github/scripts/check-disallow-native.php
        env:
          PHPBB_DISALLOW_NATIVE: '1'
          PHPBB_DISALLOW_PASSWORD: fixture-only
      - name: Check native account identity lookups and SQL modes
        if: matrix.part == 1
        run: php .github/scripts/check-userdata-native.php
        env:
          PHPBB_USERDATA_NATIVE: '1'
          PHPBB_USERDATA_PASSWORD: fixture-only
      - name: Check native CrackerTracker member-flag authority
        if: matrix.part == 2
        run: |
          php .github/scripts/check-ctracker-users-native.php
          PHPBB_CT_USERS_RAW=1 php .github/scripts/check-ctracker-users-native.php
        env:
          PHPBB_CT_USERS_NATIVE: '1'
          PHPBB_CT_USERS_PASSWORD: fixture-only
      - name: Check native CrackerTracker atomic login IP tracking
        if: matrix.part == 3
        run: php .github/scripts/check-ctracker-login-ip-native.php
        env:
          PHPBB_CT_LOGIN_IP_NATIVE: '1'
          PHPBB_CT_LOGIN_IP_PASSWORD: fixture-only
      - name: Check native Unicode account identity boundaries
        if: matrix.part == 4
        run: php .github/scripts/check-username-identity-native.php
        env:
          PHPBB_USERNAME_NATIVE: '1'
          PHPBB_USERNAME_PASSWORD: fixture-only
      - name: Check native Unicode public and ACP account creation
        if: matrix.part == 1
        run: |
          php .github/scripts/check-account-creation-identity-native.php public
          php .github/scripts/check-account-creation-identity-native.php quick-add
        env:
          PHPBB_USERNAME_CREATE_NATIVE: '1'
          PHPBB_USERNAME_CREATE_PASSWORD: fixture-only
      - name: Check native Unicode author search and username selectors
        if: matrix.part == 2
        run: php .github/scripts/check-username-search-native.php
        env:
          PHPBB_USERNAME_SEARCH_NATIVE: '1'
          PHPBB_USERNAME_SEARCH_PASSWORD: fixture-only
      - name: Check native expired and inactive login session creation
        if: matrix.part == 3
        run: php .github/scripts/check-session-creation-native.php
        env:
          PHPBB_SESSION_CREATION_NATIVE: '1'
          PHPBB_SESSION_CREATION_PASSWORD: fixture-only
      - name: Check native manual login credential and session publication
        if: matrix.part == 3
        run: php .github/scripts/check-login-publication-native.php
        env:
          PHPBB_LOGIN_PUBLICATION_NATIVE: '1'
          PHPBB_LOGIN_PUBLICATION_PASSWORD: fixture-only
      - name: Check native login and CrackerTracker telemetry publication
        if: matrix.part == 2
        run: php .github/scripts/check-login-telemetry-native.php
        env:
          PHPBB_LOGIN_TELEMETRY_NATIVE: '1'
          PHPBB_LOGIN_TELEMETRY_PASSWORD: fixture-only
      - name: Check native email bans during login and account registration
        if: matrix.part == 1
        run: |
          php .github/scripts/check-email-ban-native.php
          php .github/scripts/check-email-ban-registration-native.php
        env:
          PHPBB_EMAIL_BAN_NATIVE: '1'
          PHPBB_EMAIL_BAN_PASSWORD: fixture-only
      - name: Check native atomic ACP ban administration
        if: matrix.part == 4
        run: php .github/scripts/check-admin-ban-native.php
        env:
          PHPBB_ADMIN_BAN_NATIVE: '1'
          PHPBB_ADMIN_BAN_PASSWORD: fixture-only
      - name: Check native masked IP bans and real session publication
        if: matrix.part == 2
        run: |
          php .github/scripts/check-ip-ban.php
          php .github/scripts/check-ip-ban-native.php
          php .github/scripts/check-ip-ban-migration.php
        env:
          PHPBB_IP_BAN_NATIVE: '1'
          PHPBB_IP_BAN_PASSWORD: fixture-only
          PHPBB_IP_MIGRATION_NATIVE: '1'
          PHPBB_IP_MIGRATION_PASSWORD: fixture-only
      - name: Check native atomic user-list bulk actions
        if: matrix.part == 4
        run: php .github/scripts/check-userlist-native.php
        env:
          PHPBB_USERLIST_NATIVE: '1'
          PHPBB_USERLIST_PASSWORD: fixture-only
      - name: Check native atomic moderation card publication
        if: matrix.part == 3
        run: php -d disable_functions=mail .github/scripts/check-card-native.php
        env:
          PHPBB_CARD_NATIVE: '1'
          PHPBB_CARD_PASSWORD: fixture-only
      - name: Check native current-authority report and reset publication
        if: matrix.part == 1
        run: php -d disable_functions=mail .github/scripts/check-report-native.php
        env:
          PHPBB_REPORT_NATIVE: '1'
          PHPBB_REPORT_PASSWORD: fixture-only
      - name: Check native removed-account mixed ban preservation
        if: matrix.part == 4
        run: php .github/scripts/check-user-ban-lifecycle-native.php
        env:
          PHPBB_USER_BAN_LIFECYCLE_NATIVE: '1'
          PHPBB_USER_BAN_LIFECYCLE_PASSWORD: fixture-only
      - name: Check native ACP database backup roundtrips
        if: matrix.part == 1
        run: |
          for case in plain gzip data structure normal-source revoked read-failure concurrent-write concurrent-gzip gzip-read-failure delegated wrong-grant revoked-grant logout inactive foreign-session bad-sid legacy-table legacy-structure legacy-authority snapshot-failure commit-failure lost-ack lost-authority authority-concurrency ddl-concurrency request-transaction factory-reuse; do
            php .github/scripts/check-db-backup-native.php "$case"
          done
        env:
          PHPBB_DB_BACKUP_NATIVE: '1'
          PHPBB_DB_BACKUP_PASSWORD: fixture-only
      - if: matrix.part == 1
        run: php .github/scripts/check-erc-clear-native.php
        env:
          PHPBB_ERC_CLEAR_NATIVE: '1'
          PHPBB_ERC_CLEAR_PASSWORD: fixture-only
      - if: matrix.part == 2
        run: php .github/scripts/check-erc-roles-native.php
        env:
          PHPBB_ERC_ROLES_NATIVE: '1'
          PHPBB_ERC_ROLES_PASSWORD: fixture-only
      - if: matrix.part == 3
        run: php .github/scripts/check-erc-grant-native.php
        env:
          PHPBB_ERC_GRANT_NATIVE: '1'
          PHPBB_ERC_GRANT_PASSWORD: fixture-only
      - if: matrix.part == 4
        run: php .github/scripts/check-erc-config-native.php
        env:
          PHPBB_ERC_CONFIG_NATIVE: '1'
          PHPBB_ERC_CONFIG_PASSWORD: fixture-only
      - if: matrix.part == 1
        run: php .github/scripts/run-native-config-recovery.php
        env:
          PHPBB_CONFIG_RECOVERY_NATIVE: '1'
          PHPBB_CONFIG_RECOVERY_PASSWORD: fixture-only
      - if: matrix.part == 2
        run: php .github/scripts/check-erc-recovery-native.php
        env:
          PHPBB_ERC_RECOVERY_NATIVE: '1'
          PHPBB_ERC_RECOVERY_PASSWORD: fixture-only
      - if: matrix.part == 3
        run: php .github/scripts/check-erc-language-native.php
        env:
          PHPBB_ERC_LANGUAGE_NATIVE: '1'
          PHPBB_ERC_LANGUAGE_PASSWORD: fixture-only
      - if: matrix.part == 4
        run: php .github/scripts/check-erc-style-native.php
        env:
          PHPBB_ERC_STYLE_NATIVE: '1'
          PHPBB_ERC_STYLE_PASSWORD: fixture-only
      - if: matrix.part == 1
        run: php .github/scripts/check-style-id-migration.php
        env:
          PHPBB_STYLE_IDS_NATIVE: '1'
          PHPBB_STYLE_IDS_PASSWORD: fixture-only
      - if: matrix.part == 2
        run: php .github/scripts/check-style-files.php
      - if: matrix.part == 3
        run: php .github/scripts/check-style-clone-native.php
        env:
          PHPBB_STYLE_CLONE_NATIVE: '1'
          PHPBB_STYLE_CLONE_PASSWORD: fixture-only
      - if: matrix.part == 4
        run: php .github/scripts/check-style-install-native.php
        env:
          PHPBB_STYLE_INSTALL_NATIVE: '1'
          PHPBB_STYLE_INSTALL_PASSWORD: fixture-only
      - name: Check native style export authority and publication
        if: matrix.part == 1
        run: |
          for case in normal pending revoked file pending-file revoked-file delegated revoked-grant logout bad-sid concurrent-revoke commit-failure lost-ack old-storage invalid-default long-preferences zero lost-owner-file cache-failure existing update-failure alias-preferences ftp-quoted ftp-zero ftp-raw ftp-refused ftp-commit-failure ftp-lost-ack; do
            php .github/scripts/check-style-export-native.php "$case"
          done
        env:
          PHPBB_STYLE_EXPORT_NATIVE: '1'
          PHPBB_STYLE_EXPORT_PASSWORD: fixture-only
      - if: matrix.part == 2
        run: php .github/scripts/check-style-import-native.php
        env:
          PHPBB_STYLE_IMPORT_NATIVE: '1'
          PHPBB_STYLE_IMPORT_PASSWORD: fixture-only
      - if: matrix.part == 2
        run: php .github/scripts/check-style-import-recovery-native.php
        env:
          PHPBB_STYLE_IMPORT_RECOVERY_NATIVE: '1'
          PHPBB_STYLE_IMPORT_PASSWORD: fixture-only
      - if: matrix.part == 2
        run: |
          php .github/scripts/check-style-recovery-controller-native.php
          php .github/scripts/check-style-recovery-controller-native.php target-directory
          php .github/scripts/check-style-recovery-controller-native.php target-definition
        env:
          PHPBB_STYLE_RECOVERY_CONTROLLER_NATIVE: '1'
          PHPBB_STYLE_IMPORT_PASSWORD: fixture-only
      - if: matrix.part == 1
        run: php .github/scripts/check-style-removal-native.php
        env:
          PHPBB_STYLE_REMOVAL_NATIVE: '1'
          PHPBB_STYLE_REMOVAL_PASSWORD: fixture-only
      - if: matrix.part == 3
        run: php .github/scripts/check-style-load-native.php
        env:
          PHPBB_STYLE_LOAD_NATIVE: '1'
          PHPBB_STYLE_LOAD_PASSWORD: fixture-only
      - if: matrix.part == 4
        run: php .github/scripts/check-style-data-native.php
        env:
          PHPBB_STYLE_DATA_NATIVE: '1'
          PHPBB_STYLE_DATA_PASSWORD: fixture-only
      - if: matrix.part == 3
        run: php .github/scripts/check-style-actions-native.php
        env:
          PHPBB_STYLE_ACTIONS_NATIVE: '1'
          PHPBB_STYLE_ACTIONS_PASSWORD: fixture-only
      - if: matrix.part == 1
        run: |
          php .github/scripts/check-xs-config-native.php config
          php .github/scripts/check-xs-config-native.php ftp
        env:
          PHPBB_XS_CONFIG_NATIVE: '1'
          PHPBB_XS_CONFIG_PASSWORD: fixture-only
      - if: matrix.part == 2
        run: php .github/scripts/check-innodb-migration.php
        env:
          PHPBB_STORAGE_NATIVE: '1'
          PHPBB_STORAGE_PASSWORD: fixture-only
      - if: matrix.part == 3
        run: php .github/scripts/check-profile-field-column.php
        env:
          PHPBB_PROFILE_COLUMN_NATIVE: '1'
          PHPBB_PROFILE_COLUMN_PASSWORD: fixture-only
      - if: matrix.part == 2
        run: php .github/scripts/check-profile-definition-storage.php
        env:
          PHPBB_PROFILE_DEFINITION_NATIVE: '1'
          PHPBB_PROFILE_DEFINITION_PASSWORD: fixture-only
      - if: matrix.part == 1
        run: php .github/scripts/check-profile-retirement.php
        env:
          PHPBB_PROFILE_DEFINITION_NATIVE: '1'
          PHPBB_PROFILE_DEFINITION_PASSWORD: fixture-only
      - if: matrix.part == 1
        run: php .github/scripts/check-profile-cleanup.php
        env:
          PHPBB_PROFILE_DEFINITION_NATIVE: '1'
          PHPBB_PROFILE_DEFINITION_PASSWORD: fixture-only
      - if: matrix.part == 1
        run: |
          php .github/scripts/run-native-maintenance-users.php
          php .github/scripts/run-native-maintenance-users.php erc
        env:
          PHPBB_GUEST_PROFILE_NATIVE: '1'
          PHPBB_GUEST_PROFILE_PASSWORD: fixture-only
      - if: matrix.part == 4
        run: |
          php .github/scripts/check-kb-counters-native.php
          php .github/scripts/check-kb-counter-migration.php
          php .github/scripts/check-kb-article-actions-native.php
          php .github/scripts/check-kb-publication-native.php
          php .github/scripts/check-kb-deletion-native.php
          php .github/scripts/check-kb-category-native.php
          php .github/scripts/check-kb-types-native.php
          php .github/scripts/check-kb-config-native.php
          php .github/scripts/check-kb-guest-policy-native.php
          php .github/scripts/check-kb-discussion-native.php
          php .github/scripts/check-kb-text-boundaries-native.php
          php .github/scripts/check-kb-text-roundtrip-native.php
          php .github/scripts/check-kb-author-display-native.php
          php .github/scripts/check-kb-stats-native.php
          php .github/scripts/check-kb-quick-stats-native.php
          PHPBB_KB_TEXT_LEGACY=1 php .github/scripts/check-kb-text-roundtrip-native.php
          php .github/scripts/check-kb-writing-native.php
          php .github/scripts/check-kb-rating-migration.php
          php .github/scripts/check-post-author-migration.php
          php .github/scripts/check-kb-rating-native.php
          php .github/scripts/check-user-post-counter-migration.php
        env:
          PHPBB_KB_COUNTER_NATIVE: '1'
          PHPBB_KB_COUNTER_PASSWORD: fixture-only
      - if: matrix.part == 4
        run: php .github/scripts/check-storage-policy.php
        env:
          PHPBB_STORAGE_NATIVE: '1'
          PHPBB_STORAGE_PASSWORD: fixture-only
      - if: matrix.part == 2
        run: php .github/scripts/run-native-rebuild-session.php
        env:
          PHPBB_REBUILD_NATIVE: '1'
          PHPBB_REBUILD_TEST_PASSWORD: fixture-only
      - if: matrix.part == 4
        run: php .github/scripts/run-native-maintenance-rebuild.php
        env:
          PHPBB_REBUILD_NATIVE: '1'
          PHPBB_REBUILD_TEST_PASSWORD: fixture-only
      - if: matrix.part == 4
        run: php .github/scripts/run-native-poll-session.php
        env:
          PHPBB_POLL_MAINTENANCE_NATIVE: '1'
          PHPBB_POLL_MAINTENANCE_TEST_PASSWORD: fixture-only
