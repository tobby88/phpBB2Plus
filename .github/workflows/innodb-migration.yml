name: Native InnoDB migration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  migration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '7.4', '8.5']
    services:
      database:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pfixture-only"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql, pdo_sqlite, openssl
          coverage: none
      - run: php .github/scripts/check-innodb-migration.php
        env:
          PHPBB_STORAGE_NATIVE: '1'
          PHPBB_STORAGE_PASSWORD: fixture-only
      - run: php .github/scripts/check-profile-field-column.php
        env:
          PHPBB_PROFILE_COLUMN_NATIVE: '1'
          PHPBB_PROFILE_COLUMN_PASSWORD: fixture-only
      - run: php .github/scripts/check-profile-definition-storage.php
        env:
          PHPBB_PROFILE_DEFINITION_NATIVE: '1'
          PHPBB_PROFILE_DEFINITION_PASSWORD: fixture-only
      - run: php .github/scripts/check-profile-retirement.php
        env:
          PHPBB_PROFILE_DEFINITION_NATIVE: '1'
          PHPBB_PROFILE_DEFINITION_PASSWORD: fixture-only
      - run: php .github/scripts/check-storage-policy.php
        env:
          PHPBB_STORAGE_NATIVE: '1'
          PHPBB_STORAGE_PASSWORD: fixture-only
      - run: php .github/scripts/run-native-rebuild-session.php
        env:
          PHPBB_REBUILD_NATIVE: '1'
          PHPBB_REBUILD_TEST_PASSWORD: fixture-only
      - run: php .github/scripts/run-native-poll-session.php
        env:
          PHPBB_POLL_MAINTENANCE_NATIVE: '1'
          PHPBB_POLL_MAINTENANCE_TEST_PASSWORD: fixture-only
      - run: |
          php .github/scripts/run-native-pm-maintenance.php counter
          php .github/scripts/run-native-pm-maintenance.php repair
        env:
          PHPBB_PM_MAINTENANCE_NATIVE: '1'
          PHPBB_PM_MAINTENANCE_TEST_PASSWORD: fixture-only
      - run: php .github/scripts/run-native-acl-session.php
        env:
          PHPBB_ACL_SESSION_NATIVE: '1'
          PHPBB_ACL_SESSION_TEST_PASSWORD: fixture-only
      - run: php .github/scripts/check-ctracker-rate-storage.php
        env:
          PHPBB_RATE_NATIVE: '1'
          PHPBB_RATE_TEST_PASSWORD: fixture-only
      - run: |
          php .github/scripts/check-ctracker-recovery-storage.php
          php .github/scripts/check-ctracker-admin-authority.php
          php .github/scripts/check-ctracker-commit-native.php
        env:
          PHPBB_CT_RECOVERY_NATIVE: '1'
          PHPBB_CT_RECOVERY_TEST_PASSWORD: fixture-only
      - run: php .github/scripts/check-board-config-storage.php
        env:
          PHPBB_BOARD_CONFIG_NATIVE: '1'
          PHPBB_BOARD_CONFIG_PASSWORD: fixture-only
      - run: |
          php .github/scripts/check-settings-commit-native.php board
          php .github/scripts/check-settings-commit-native.php mods
        env:
          PHPBB_SETTINGS_COMMIT_NATIVE: '1'
          PHPBB_SETTINGS_COMMIT_PASSWORD: fixture-only
      - run: |
          php .github/scripts/check-mod-settings-defaults.php
          php .github/scripts/check-mod-settings-storage.php
        env:
          PHPBB_MOD_SETTINGS_NATIVE: '1'
          PHPBB_MOD_SETTINGS_PASSWORD: fixture-only
      - run: php .github/scripts/check-attachment-settings-storage.php
        env:
          PHPBB_ATTACH_SETTINGS_NATIVE: '1'
          PHPBB_ATTACH_SETTINGS_PASSWORD: fixture-only
      - run: |
          php .github/scripts/check-new-user-quota-target.php
          php .github/scripts/check-attachment-quota-storage.php
          php .github/scripts/check-attachment-quota-lifecycle-native.php
        env:
          PHPBB_QUOTA_NATIVE: '1'
          PHPBB_QUOTA_PASSWORD: fixture-only
      - run: php .github/scripts/check-group-admin-native.php
        env:
          PHPBB_GROUP_ADMIN_NATIVE: '1'
          PHPBB_GROUP_ADMIN_PASSWORD: fixture-only
      - run: |
          php .github/scripts/check-group-display.php
          php .github/scripts/check-group-membership-native.php
        env:
          PHPBB_GROUP_MEMBERSHIP_NATIVE: '1'
          PHPBB_GROUP_MEMBERSHIP_PASSWORD: fixture-only
      - run: php .github/scripts/check-acl-save-native.php
        env:
          PHPBB_ACL_SAVE_NATIVE: '1'
          PHPBB_ACL_SAVE_PASSWORD: fixture-only
      - run: php .github/scripts/check-account-activation-native.php
        env:
          PHPBB_ACTIVATION_NATIVE: '1'
          PHPBB_ACTIVATION_PASSWORD: fixture-only
      - run: php .github/scripts/check-password-reset-request-native.php
        env:
          PHPBB_RESET_REQUEST_NATIVE: '1'
          PHPBB_RESET_REQUEST_PASSWORD: fixture-only
      - run: php .github/scripts/check-registration-native.php
        env:
          PHPBB_REGISTRATION_NATIVE: '1'
          PHPBB_REGISTRATION_PASSWORD: fixture-only
      - run: php .github/scripts/check-admin-registration-native.php
        env:
          PHPBB_QUICK_ADD_NATIVE: '1'
          PHPBB_QUICK_ADD_PASSWORD: fixture-only
      - run: php .github/scripts/check-admin-profile-native.php
        env:
          PHPBB_ADMIN_PROFILE_NATIVE: '1'
          PHPBB_ADMIN_PROFILE_PASSWORD: fixture-only
      - run: php .github/scripts/check-admin-profile-identity-native.php
        env:
          PHPBB_ADMIN_PROFILE_NATIVE: '1'
          PHPBB_ADMIN_PROFILE_PASSWORD: fixture-only
      - run: php .github/scripts/check-maintenance-roles-native.php
        env:
          PHPBB_ROLES_NATIVE: '1'
          PHPBB_ROLES_PASSWORD: fixture-only
      - run: php .github/scripts/check-topic-move-native.php
        env:
          PHPBB_MOVE_NATIVE: '1'
          PHPBB_MOVE_PASSWORD: fixture-only
      - run: php .github/scripts/check-topic-state-native.php
        env:
          PHPBB_STATE_NATIVE: '1'
          PHPBB_STATE_PASSWORD: fixture-only
      - run: php .github/scripts/check-topic-split-native.php
        env:
          PHPBB_SPLIT_NATIVE: '1'
          PHPBB_SPLIT_PASSWORD: fixture-only
      - run: php .github/scripts/check-topic-merge-native.php
        env:
          PHPBB_MERGE_NATIVE: '1'
          PHPBB_MERGE_PASSWORD: fixture-only
      - run: php .github/scripts/check-poll-vote-native.php
        env:
          PHPBB_VOTE_NATIVE: '1'
          PHPBB_VOTE_PASSWORD: fixture-only
      - run: php .github/scripts/check-ajax-edit-native.php
        env:
          PHPBB_AJAX_EDIT_NATIVE: '1'
          PHPBB_AJAX_EDIT_PASSWORD: fixture-only
      - run: php .github/scripts/check-post-submit-native.php
        env:
          PHPBB_POST_SUBMIT_NATIVE: '1'
          PHPBB_POST_SUBMIT_PASSWORD: fixture-only
      - run: php .github/scripts/check-full-editor-native.php
        env:
          PHPBB_FULL_EDITOR_NATIVE: '1'
          PHPBB_FULL_EDITOR_PASSWORD: fixture-only
      - run: php .github/scripts/check-post-delete-native.php
        env:
          PHPBB_POST_DELETE_NATIVE: '1'
          PHPBB_POST_DELETE_PASSWORD: fixture-only
      - run: php .github/scripts/check-topic-removal-native.php
        env:
          PHPBB_TOPIC_REMOVAL_NATIVE: '1'
          PHPBB_TOPIC_REMOVAL_PASSWORD: fixture-only
      - run: php .github/scripts/check-post-storage-metadata-native.php
        env:
          PHPBB_POST_METADATA_NATIVE: '1'
          PHPBB_POST_METADATA_PASSWORD: fixture-only
      - run: php .github/scripts/check-poll-maintenance-native.php
        env:
          PHPBB_POLL_MAINTENANCE_NATIVE: '1'
          PHPBB_POLL_MAINTENANCE_PASSWORD: fixture-only
      - run: |
          php .github/scripts/check-interactive-storage-native.php ajax
          php .github/scripts/check-interactive-storage-native.php vote
        env:
          PHPBB_INTERACTIVE_NATIVE: '1'
          PHPBB_INTERACTIVE_PASSWORD: fixture-only
      - run: |
          php .github/scripts/check-moderation-commit-native.php state
          php .github/scripts/check-moderation-commit-native.php move
          php .github/scripts/check-moderation-commit-native.php split
          php .github/scripts/check-moderation-commit-native.php merge
        env:
          PHPBB_MODERATION_COMMIT_NATIVE: '1'
          PHPBB_MODERATION_COMMIT_PASSWORD: fixture-only
      - run: php .github/scripts/check-public-profile-avatar.php
        env:
          PHPBB_PUBLIC_AVATAR_NATIVE: '1'
          PHPBB_PUBLIC_AVATAR_PASSWORD: fixture-only
      - run: php .github/scripts/check-public-profile-native.php
        env:
          PHPBB_PUBLIC_PROFILE_NATIVE: '1'
          PHPBB_PUBLIC_PROFILE_PASSWORD: fixture-only
      - run: php .github/scripts/check-signature-save-native.php
        env:
          PHPBB_SIGNATURE_NATIVE: '1'
          PHPBB_SIGNATURE_PASSWORD: fixture-only
      - run: php .github/scripts/check-public-profile-identity-native.php
        env:
          PHPBB_PUBLIC_PROFILE_NATIVE: '1'
          PHPBB_PUBLIC_PROFILE_PASSWORD: fixture-only
