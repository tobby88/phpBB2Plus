name: phpBB3 Plus
on:
  push:
    branches: [codex/phpbb3-plus]
    paths:
      - 'phpBB3/**'
      - 'tools/build_phpbb3.py'
      - 'tests/phpbb3/**'
      - 'phpBB2/templates/fisubsilversh/images/**'
      - '.github/workflows/phpbb3-plus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  port:
    name: phpBB3 on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.5']
    services:
      db:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: fixture-only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=2s --health-timeout=4s --health-retries=25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, intl, gd, zip, xml
          coverage: none
      - name: Test a clean phpBB3 installation
        env:
          PLUS_TEST_DATABASE: '1'
          PLUS_TEST_DB_PASSWORD: fixture-only
          PLUS_TEST_DB_PORT: ${{ job.services.db.ports[3306] }}
        run: python3 tests/phpbb3/integration.py --cache "${RUNNER_TEMP}/plus3-packages"
