name: phpBB3 Plus
on:
  push:
    branches: [codex/phpbb3-plus]
    paths:
      - 'phpBB3/**'
      - 'tools/build_phpbb3.py'
      - 'vendor/phpbb/**'
      - 'tests/phpbb3/**'
      - 'phpBB2/templates/fisubsilversh/images/**'
      - 'phpBB2/templates/fisubsilversh/admin/admin_users*_list_body.tpl'
      - 'phpBB2/images/flags/**'
      - 'phpBB2/images/icon/**'
      - 'phpBB2/images/avatars/gallery/**'
      - 'phpBB2/images/banner/**'
      - 'phpBB2/images/links/**'
      - 'phpBB2/images/ranks/**'
      - 'phpBB2/images/smiles/**'
      - 'phpBB2/smilie_creator/images/smilies/schild/**'
      - 'phpBB2/text2schild.php'
      - 'phpBB2/includes/functions_schild.php'
      - 'phpBB2/assets/fonts/**'
      - 'phpBB2/admin/admin_*.php'
      - 'phpBB2/admin/pagestart.php'
      - 'phpBB2/ctracker/admin/acp_module_settings.php'
      - 'phpBB2/ctracker/admin/acp_module_globalmessage.php'
      - 'phpBB2/includes/functions_login_storage.php'
      - 'phpBB2/includes/functions_userlist_storage.php'
      - 'phpBB2/includes/functions_board_config.php'
      - 'phpBB2/includes/functions_content_admin.php'
      - 'phpBB2/includes/functions_color_groups.php'
      - 'phpBB2/includes/functions_admin_registration_storage.php'
      - 'phpBB2/includes/functions_profile_fields.php'
      - 'phpBB2/includes/functions_user_ids.php'
      - 'phpBB2/includes/functions_validate.php'
      - 'phpBB2/change_password.php'
      - 'phpBB2/ctracker/classes/class_admin_actions.php'
      - 'phpBB2/ctracker/classes/class_ct_adminfunctions.php'
      - 'phpBB2/ctracker/classes/class_ct_database.php'
      - 'phpBB2/ctracker/classes/class_settings_storage.php'
      - 'phpBB2/ctracker/classes/class_configuration_storage.php'
      - 'phpBB2/ctracker/classes/class_acp_storage.php'
      - 'phpBB2/album_mod/album_admin*.php'
      - 'phpBB2/album_mod/album_category_remove.php'
      - 'phpBB2/album_mod/album_lifecycle_authority.php'
      - 'phpBB2/album_mod/album_cache_maintenance.php'
      - 'phpBB2/album_mod/album_file_storage.php'
      - 'phpBB2/album_mod/album_file_coordinator.php'
      - 'phpBB2/pafiledb/pafiledb_common.php'
      - 'phpBB2/pafiledb/includes/*.php'
      - 'phpBB2/includes/functions_acl_storage.php'
      - 'phpBB2/includes/functions.php'
      - 'phpBB2/attach_mod/includes/functions_quota_storage.php'
      - 'phpBB2/attach_mod/includes/functions_mutation.php'
      - 'phpBB2/attach_mod/includes/functions_pm_staging.php'
      - 'phpBB2/attach_mod/includes/functions_settings_storage.php'
      - 'phpBB2/includes/functions_arcade*.php'
      - 'phpBB2/includes/classes_arcade.php'
      - 'phpBB2/includes/constants_arcade.php'
      - 'phpBB2/includes/functions_connection_ownership.php'
      - 'phpBB2/includes/functions_flags_storage.php'
      - 'phpBB2/includes/functions_link_*.php'
      - 'phpBB2/includes/functions_moderator_identity.php'
      - 'phpBB2/includes/functions_username.php'
      - 'phpBB2/includes/php_compat.php'
      - 'phpBB2/includes/functions_owned_storage.php'
      - 'phpBB2/includes/functions_ban.php'
      - 'phpBB2/includes/functions_jr_admin*.php'
      - 'phpBB2/includes/functions_stats.php'
      - 'phpBB2/includes/functions_module.php'
      - 'phpBB2/includes/functions_post_author.php'
      - 'phpBB2/includes/icon_defaults.php'
      - 'phpBB2/language/lang_*/lang_extend_post_icons.php'
      - 'phpBB2/install/schemas/*.sql'
      - 'phpBB2/stat_modules/*/module.php'
      - 'phpBB2/stat_modules/*/module.tpl'
      - 'phpBB2/stat_modules/*/info.txt'
      - 'phpBB2/assets/ruffle/**'
      - '.github/workflows/phpbb3-plus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  port:
    name: phpBB3 on PHP ${{ matrix.php }} (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.5']
        suite: [forum, media, management]
    services:
      db:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: fixture-only
        ports:
          - 3306/tcp
        # The job's two disposable schemas keep normal MariaDB/InnoDB commit settings.
        options: >-
          --mount type=tmpfs,destination=/var/lib/mysql,tmpfs-size=1073741824
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=2s --health-timeout=4s --health-retries=25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, intl, gd, zip, xml, opcache
          coverage: none
      - name: Test a clean phpBB3 installation
        env:
          PLUS_TEST_DATABASE: '1'
          PLUS_TEST_DB_PASSWORD: fixture-only
          PLUS_TEST_DB_PORT: ${{ job.services.db.ports[3306] }}
          PLUS_TEST_CHROME: ${{ matrix.php == '8.5' && matrix.suite != 'media' && 'google-chrome' || '' }}
        run: python3 tests/phpbb3/integration.py --cache vendor/phpbb --offline --suite "${{ matrix.suite }}"
