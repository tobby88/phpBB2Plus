services:
    phpbb2plus.gallery.moderation:
        class: phpbb2plus\gallery\service\moderation
        arguments: ['@dbal.conn', '@phpbb2plus.gallery.access', '@phpbb2plus.gallery.pictures', '@phpbb2plus.gallery.picture_navigation', '@user', '%core.table_prefix%plus_album_']
    phpbb2plus.gallery.moderation_controller:
        class: phpbb2plus\gallery\controller\moderation
        arguments: ['@phpbb2plus.gallery.moderation', '@phpbb2plus.gallery.pictures', '@phpbb2plus.gallery.byline', '@request', '@controller.helper', '@template', '@language', '@user', '@pagination', '@config']
    phpbb2plus.gallery.personal_settings:
        alias: phpbb2plus.gallery.settings
    phpbb2plus.gallery.settings:
        class: phpbb2plus\gallery\service\settings
        arguments: ['@dbal.conn', '@phpbb2plus.gallery.access', '@phpbb2plus.gallery.admin_access', '%core.table_prefix%plus_album_settings', '@config', '%core.root_path%', '@php_ini']
    phpbb2plus.gallery.personal:
        class: phpbb2plus\gallery\service\personal
        arguments: ['@dbal.conn', '@phpbb2plus.gallery.access', '@phpbb2plus.gallery.hierarchy', '%core.table_prefix%plus_album_']
    phpbb2plus.gallery.hierarchy:
        class: phpbb2plus\gallery\service\hierarchy
        arguments: ['@dbal.conn', '@phpbb2plus.gallery.pictures', '%core.table_prefix%plus_album_']
    phpbb2plus.gallery.categories:
        class: phpbb2plus\gallery\service\categories
        arguments: ['@dbal.conn', '@phpbb2plus.gallery.hierarchy', '@phpbb2plus.gallery.access', '@phpbb2plus.gallery.admin_access', '@user', '%core.table_prefix%plus_album_cats', '@log']
    phpbb2plus.gallery.admin_access:
        class: phpbb2plus\gallery\service\admin_access
        arguments: ['@dbal.conn', '@auth', '@user']
    phpbb2plus.gallery.permissions:
        class: phpbb2plus\gallery\service\permissions
        arguments: ['@dbal.conn', '@phpbb2plus.gallery.hierarchy', '@phpbb2plus.gallery.access', '@phpbb2plus.gallery.admin_access', '@user', '@log', '%core.table_prefix%plus_album_grants']
    phpbb2plus.gallery.personal_grants:
        class: phpbb2plus\gallery\service\personal_grants
        arguments: ['@dbal.conn', '@phpbb2plus.gallery.permissions', '@phpbb2plus.gallery.access', '@phpbb2plus.gallery.admin_access', '@auth', '@user', '@log', '%core.table_prefix%plus_album_']
    phpbb2plus.gallery.personal_controller:
        class: phpbb2plus\gallery\controller\personal
        arguments: ['@phpbb2plus.gallery.personal', '@phpbb2plus.gallery.access', '@request', '@controller.helper', '@language', '@template', '@user', '@?phpbb2plus.community.legacy']
    phpbb2plus.gallery.byline:
        class: phpbb2plus\gallery\service\byline
        arguments: ['@user', '@language', '@?phpbb2plus.community.former_members']
    phpbb2plus.gallery.portal:
        class: phpbb2plus\gallery\event\portal
        arguments: ['@phpbb2plus.gallery.access', '@phpbb2plus.gallery.byline', '@dbal.conn', '@config', '@config_text', '@template', '@controller.helper', '@language', '@user', '%core.table_prefix%plus_album_']
        tags:
            - { name: event.listener }
    phpbb2plus.gallery.access:
        class: phpbb2plus\gallery\service\access
        arguments: ['@dbal.conn', '@user', '@auth', '%core.table_prefix%plus_album_']
    phpbb2plus.gallery.picture_navigation:
        class: phpbb2plus\gallery\service\navigation
        arguments: ['@dbal.conn', '@phpbb2plus.gallery.access', '@phpbb2plus.gallery.byline', '%core.table_prefix%plus_album_']
    phpbb2plus.gallery.member_pictures:
        class: phpbb2plus\gallery\service\member_pictures
        arguments: ['@dbal.conn', '@phpbb2plus.gallery.access', '@phpbb2plus.gallery.personal', '@phpbb2plus.gallery.picture_navigation', '%core.table_prefix%plus_album_']
    phpbb2plus.gallery.category_index:
        class: phpbb2plus\gallery\service\category_index
        arguments: ['@dbal.conn', '@phpbb2plus.gallery.access', '%core.table_prefix%plus_album_']
    phpbb2plus.gallery.search:
        class: phpbb2plus\gallery\controller\search
        arguments: ['@dbal.conn', '@phpbb2plus.gallery.access', '@phpbb2plus.gallery.byline', '@request', '@controller.helper', '@template', '@language', '@user', '@pagination', '@config', '%core.table_prefix%plus_album_pics']
    phpbb2plus.gallery.board:
        class: phpbb2plus\gallery\controller\board
        arguments: ['@phpbb2plus.gallery.access', '@dbal.conn', '@user', '@language', '@template', '@controller.helper', '@request', '@pagination', '%core.table_prefix%plus_album_', '@phpbb2plus.gallery.discussion', '@phpbb2plus.gallery.pictures', '@phpbb2plus.gallery.byline', '@phpbb2plus.gallery.personal', '@phpbb2plus.gallery.picture_navigation', '@config', '@phpbb2plus.gallery.member_pictures', '@phpbb2plus.gallery.category_index', '@group_helper']
    phpbb2plus.gallery.media:
        class: phpbb2plus\gallery\controller\media
        arguments: ['@phpbb2plus.gallery.access', '@config', '%core.root_path%', '@php_ini', '@symfony_request', '@language']
    phpbb2plus.gallery.navigation:
        class: phpbb2plus\gallery\event\navigation
        arguments: ['@controller.helper', '@template', '@language', '@phpbb2plus.gallery.personal', '@phpbb2plus.gallery.access', '@user']
        tags:
            - { name: event.listener }
    phpbb2plus.gallery.uploads:
        class: phpbb2plus\gallery\service\uploads
        arguments: ['@phpbb2plus.gallery.access', '@dbal.conn', '@user', '@config', '@php_ini', '%core.root_path%', '%core.table_prefix%plus_album_']
    phpbb2plus.gallery.upload:
        class: phpbb2plus\gallery\controller\upload
        arguments: ['@phpbb2plus.gallery.uploads', '@request', '@template', '@controller.helper', '@language', '@user']
    phpbb2plus.gallery.discussion:
        class: phpbb2plus\gallery\service\discussion
        arguments: ['@phpbb2plus.gallery.access', '@dbal.conn', '@user', '%core.table_prefix%plus_album_', '%core.root_path%', '@config']
    phpbb2plus.gallery.comments:
        class: phpbb2plus\gallery\controller\comments
        arguments: ['@phpbb2plus.gallery.discussion', '@request', '@controller.helper', '@language', '@template']
    phpbb2plus.gallery.pictures:
        class: phpbb2plus\gallery\service\pictures
        arguments: ['@phpbb2plus.gallery.access', '@dbal.conn', '%core.table_prefix%plus_album_']
    phpbb2plus.gallery.manage:
        class: phpbb2plus\gallery\controller\manage
        arguments: ['@phpbb2plus.gallery.pictures', '@controller.helper', '@request', '@template', '@language', '@phpbb2plus.gallery.uploads']
    phpbb2plus.gallery.accounts:
        class: phpbb2plus\gallery\event\accounts
        arguments: ['@dbal.conn', '%core.table_prefix%plus_album_', '@phpbb2plus.gallery.access']
        tags:
            - { name: event.listener }
    phpbb2plus.gallery.cleanup:
        class: phpbb2plus\gallery\cron\cleanup
        arguments: ['@dbal.conn', '@config', '%core.table_prefix%plus_album_', '%core.root_path%', '@phpbb2plus.gallery.access', '@phpbb2plus.gallery.preview_cache']
        calls:
            - [set_name, [phpbb2plus.gallery.cleanup]]
        tags:
            - { name: cron.task }
    phpbb2plus.gallery.preview_cache:
        class: phpbb2plus\gallery\service\preview_cache
        arguments: ['@dbal.conn', '@config', '@phpbb2plus.gallery.access', '@phpbb2plus.gallery.admin_access', '@user', '@log']
