phpbb2plus_gallery_index:
    path: /album
    defaults: { _controller: phpbb2plus.gallery.board:index, category: 0 }
    methods: [GET, HEAD]
phpbb2plus_gallery_category:
    path: /album/category/{category}
    defaults: { _controller: phpbb2plus.gallery.board:index }
    requirements: { category: '[1-9][0-9]*' }
    methods: [GET, HEAD]
phpbb2plus_gallery_picture:
    path: /album/picture/{picture}
    defaults: { _controller: phpbb2plus.gallery.board:picture }
    requirements: { picture: '[1-9][0-9]*' }
    methods: [GET, HEAD]
phpbb2plus_gallery_upload:
    path: /album/category/{category}/upload
    defaults: { _controller: phpbb2plus.gallery.upload:form }
    requirements: { category: '[1-9][0-9]*' }
    methods: [GET, POST]
phpbb2plus_gallery_media:
    path: /album/picture/{picture}/{size}
    defaults: { _controller: phpbb2plus.gallery.media:show }
    requirements: { picture: '[1-9][0-9]*', size: 'small|medium|full' }
    methods: [GET, HEAD]
phpbb2plus_gallery_discuss:
    path: /album/picture/{picture}/discussion
    defaults: { _controller: phpbb2plus.gallery.comments:post }
    requirements: { picture: '[1-9][0-9]*' }
    methods: [POST]
phpbb2plus_gallery_manage:
    path: /album/picture/{picture}/manage/{mode}
    defaults: { _controller: phpbb2plus.gallery.manage:picture }
    requirements: { picture: '[1-9][0-9]*', mode: 'edit|move|approve|unapprove|lock|unlock|delete' }
    methods: [GET, POST]
phpbb2plus_gallery_comment:
    path: /album/picture/{picture}/comment/{comment}/{mode}
    defaults: { _controller: phpbb2plus.gallery.comments:manage }
    requirements: { picture: '[1-9][0-9]*', comment: '[1-9][0-9]*', mode: 'edit|delete' }
    methods: [GET, POST]
