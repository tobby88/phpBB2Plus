phpbb2plus_gallery_index:
    path: /album
    defaults: { _controller: phpbb2plus.gallery.board:index, category: 0 }
    methods: [GET, HEAD]
phpbb2plus_gallery_search:
    path: /album/search
    defaults: { _controller: phpbb2plus.gallery.search:find }
    methods: [GET, HEAD, POST]
phpbb2plus_gallery_hot:
    path: /album/hot-or-not
    defaults: { _controller: phpbb2plus.gallery.board:hot }
    methods: [GET, HEAD, POST]
phpbb2plus_gallery_members:
    path: /album/members
    defaults: { _controller: phpbb2plus.gallery.board:members }
    methods: [GET, HEAD, POST]
phpbb2plus_gallery_personal:
    path: /album/member/{owner}
    defaults: { _controller: phpbb2plus.gallery.personal_controller:index }
    requirements: { owner: '[1-9][0-9]*' }
    methods: [GET, HEAD]
phpbb2plus_gallery_member_pictures:
    path: /album/member/{owner}/pictures
    defaults: { _controller: phpbb2plus.gallery.board:collection, type: all }
    requirements: { owner: '[1-9][0-9]*' }
    methods: [GET, HEAD]
phpbb2plus_gallery_member_activity:
    path: /album/member/{owner}/activity/{type}
    defaults: { _controller: phpbb2plus.gallery.board:collection }
    requirements: { owner: '[1-9][0-9]*', type: 'pic|rating|comment' }
    methods: [GET, HEAD]
phpbb2plus_gallery_comment_legacy:
    path: /album/legacy/comment/{comment}
    defaults: { _controller: phpbb2plus.gallery.board:comment_bookmark }
    requirements: { comment: '[1-9][0-9]*' }
    methods: [GET, HEAD]
phpbb2plus_gallery_comment_manage_legacy:
    path: /album/legacy/comment/{comment}/{mode}
    defaults: { _controller: phpbb2plus.gallery.comments:bookmark }
    requirements: { comment: '[1-9][0-9]*', mode: 'edit|delete' }
    methods: [GET, HEAD]
phpbb2plus_gallery_personal_legacy:
    path: /album/legacy/member/{source}
    defaults: { _controller: phpbb2plus.gallery.personal_controller:bookmark }
    requirements: { source: '-1|0|[1-9][0-9]*' }
    methods: [GET, HEAD]
phpbb2plus_gallery_personal_form:
    path: /album/member/{owner}/{category}/{mode}
    defaults: { _controller: phpbb2plus.gallery.personal_controller:form }
    requirements: { owner: '[1-9][0-9]*', category: '0|[1-9][0-9]*', mode: 'start|add|edit|up|down|delete' }
    methods: [GET, POST]
phpbb2plus_gallery_category:
    path: /album/category/{category}
    defaults: { _controller: phpbb2plus.gallery.board:index }
    requirements: { category: '[1-9][0-9]*' }
    methods: [GET, HEAD]
phpbb2plus_gallery_moderate:
    path: /album/category/{category}/moderate
    defaults: { _controller: phpbb2plus.gallery.moderation_controller:show }
    requirements: { category: '[1-9][0-9]*' }
    methods: [GET, HEAD, POST]
phpbb2plus_gallery_picture:
    path: /album/picture/{picture}
    defaults: { _controller: phpbb2plus.gallery.board:picture }
    requirements: { picture: '[1-9][0-9]*' }
    methods: [GET, HEAD]
phpbb2plus_gallery_upload:
    path: /album/category/{category}/upload
    defaults: { _controller: phpbb2plus.gallery.upload:form }
    requirements: { category: '[1-9][0-9]*' }
    methods: [GET, POST]
phpbb2plus_gallery_media:
    path: /album/picture/{picture}/{size}
    defaults: { _controller: phpbb2plus.gallery.media:show }
    requirements: { picture: '[1-9][0-9]*', size: 'small|medium|full' }
    methods: [GET, HEAD]
phpbb2plus_gallery_discuss:
    path: /album/picture/{picture}/discussion
    defaults: { _controller: phpbb2plus.gallery.comments:post }
    requirements: { picture: '[1-9][0-9]*' }
    methods: [POST]
phpbb2plus_gallery_manage:
    path: /album/picture/{picture}/manage/{mode}
    defaults: { _controller: phpbb2plus.gallery.manage:picture }
    requirements: { picture: '[1-9][0-9]*', mode: 'edit|move|approve|unapprove|lock|unlock|delete' }
    methods: [GET, POST]
phpbb2plus_gallery_comment:
    path: /album/picture/{picture}/comment/{comment}/{mode}
    defaults: { _controller: phpbb2plus.gallery.comments:manage }
    requirements: { picture: '[1-9][0-9]*', comment: '[1-9][0-9]*', mode: 'edit|delete' }
    methods: [GET, POST]
