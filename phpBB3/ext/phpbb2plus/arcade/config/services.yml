services:
    phpbb2plus.arcade.catalog:
        class: phpbb2plus\arcade\service\catalog
        arguments: ['@dbal.conn', '@auth', '@user', '%core.table_prefix%plus_arc_']
    phpbb2plus.arcade.board:
        class: phpbb2plus\arcade\controller\board
        arguments: ['@phpbb2plus.arcade.catalog', '@dbal.conn', '@user', '@language', '@template', '@controller.helper', '@request', '@pagination', '%core.table_prefix%plus_arc_', '@?phpbb2plus.community.former_members']
    phpbb2plus.arcade.events:
        class: phpbb2plus\arcade\event\listener
        arguments: ['@language', '@template', '@controller.helper', '@dbal.conn', '%core.table_prefix%plus_arc_']
        tags:
            - { name: event.listener }
