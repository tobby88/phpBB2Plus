services:
    phpbb2plus.arcade.admin_access:
        class: phpbb2plus\arcade\service\admin_access
        arguments: ['@dbal.conn', '@auth', '@user', '%core.table_prefix%plus_jr_delegations']
    phpbb2plus.arcade.diagnostics:
        class: phpbb2plus\arcade\service\diagnostics
        arguments: ['@dbal.conn', '@phpbb2plus.arcade.admin_access', '@phpbb2plus.arcade.catalog', '@phpbb2plus.arcade.sessions', '@log', '@user', '%core.table_prefix%plus_arc_log']
    phpbb2plus.arcade.category_management:
        class: phpbb2plus\arcade\service\category_management
        arguments: ['@dbal.conn', '@phpbb2plus.arcade.admin_access', '@phpbb2plus.arcade.sessions', '@phpbb2plus.arcade.artwork', '%core.table_prefix%']
    phpbb2plus.arcade.game_editor:
        class: phpbb2plus\arcade\service\game_editor
        arguments: ['@dbal.conn', '@phpbb2plus.arcade.admin_access', '@phpbb2plus.arcade.sessions', '@phpbb2plus.arcade.catalog', '@phpbb2plus.arcade.category_management', '@log', '@user', '%core.table_prefix%plus_arc_', '@phpbb2plus.arcade.staged_media']
    phpbb2plus.arcade.staged_media:
        class: phpbb2plus\arcade\service\staged_media
        arguments: ['@dbal.conn', '@config', '%core.table_prefix%plus_arc_', '%core.root_path%']
    phpbb2plus.arcade.stage_game:
        class: phpbb2plus\arcade\console\stage_game
        arguments: ['@phpbb2plus.arcade.staged_media']
        tags:
            - { name: console.command }
    phpbb2plus.arcade.batch_import:
        class: phpbb2plus\arcade\service\batch_import
        arguments: ['@dbal.conn', '@phpbb2plus.arcade.admin_access', '@phpbb2plus.arcade.sessions', '@phpbb2plus.arcade.game_editor', '@phpbb2plus.arcade.staged_media', '@log', '@user', '%core.table_prefix%plus_arc_imports']
    phpbb2plus.arcade.stage_directory:
        class: phpbb2plus\arcade\console\stage_directory
        arguments: ['@phpbb2plus.arcade.batch_import']
        tags:
            - { name: console.command }
    phpbb2plus.arcade.score_moderation:
        class: phpbb2plus\arcade\service\score_moderation
        arguments: ['@dbal.conn', '@auth', '@user', '%core.table_prefix%plus_arc_', '@phpbb2plus.arcade.sessions', '@log']
    phpbb2plus.arcade.score_panel:
        class: phpbb2plus\arcade\controller\score_panel
        arguments: ['@phpbb2plus.arcade.score_moderation', '@user', '@language', '@template', '@request', '@controller.helper', '@phpbb2plus.arcade.artwork', '@?phpbb2plus.community.former_members']
    phpbb2plus.arcade.tournament_management:
        class: phpbb2plus\arcade\service\tournament_management
        arguments: ['@dbal.conn', '@phpbb2plus.arcade.catalog', '@phpbb2plus.arcade.tournaments', '%core.table_prefix%plus_arc_', '@log', '@user']
    phpbb2plus.arcade.settings:
        class: phpbb2plus\arcade\service\settings
        arguments: ['@dbal.conn', '@phpbb2plus.arcade.catalog', '%core.table_prefix%plus_arc_settings']
    phpbb2plus.arcade.tournament_closure:
        class: phpbb2plus\arcade\service\tournament_closure
        arguments: ['@dbal.conn', '@phpbb2plus.arcade.catalog', '@phpbb2plus.arcade.tournaments', '@phpbb2plus.arcade.tournament_management', '%core.table_prefix%plus_arc_', '@phpbb2plus.arcade.tournament_notices']
    phpbb2plus.arcade.tournament_notices:
        class: phpbb2plus\arcade\cron\tournament_notices
        arguments: ['@dbal.conn', '@config', '@auth', '@phpbb2plus.arcade.catalog', '@phpbb2plus.arcade.messages', '%core.table_prefix%plus_arc_']
        calls:
            - [set_name, [phpbb2plus.arcade.tournament_notices]]
        tags:
            - { name: cron.task }
    phpbb2plus.arcade.tournament_games:
        class: phpbb2plus\arcade\service\tournament_games
        arguments: ['@dbal.conn', '@phpbb2plus.arcade.catalog', '@phpbb2plus.arcade.tournaments', '@phpbb2plus.arcade.tournament_management', '%core.table_prefix%plus_arc_']
    phpbb2plus.arcade.tournaments:
        class: phpbb2plus\arcade\service\tournaments
        arguments: ['@dbal.conn', '@phpbb2plus.arcade.catalog', '@user', '%core.table_prefix%plus_arc_']
    phpbb2plus.arcade.events_board:
        class: phpbb2plus\arcade\controller\tournaments
        arguments: ['@phpbb2plus.arcade.tournaments', '@phpbb2plus.arcade.sessions', '@user', '@language', '@template', '@controller.helper', '@request', '@pagination', '@phpbb2plus.arcade.tournament_management']
    phpbb2plus.arcade.comments:
        class: phpbb2plus\arcade\service\comments
        arguments: ['@dbal.conn', '@phpbb2plus.arcade.catalog', '@user', '@auth', '@config', '%core.table_prefix%plus_arc_', '@phpbb2plus.arcade.messages']
    phpbb2plus.arcade.messages:
        class: phpbb2plus\arcade\service\messages
        arguments: ['@language', '@request', '%core.root_path%', '%core.php_ext%']
    phpbb2plus.arcade.preferences:
        class: phpbb2plus\arcade\event\preferences
        arguments: ['@dbal.conn', '@user', '@request', '@language', '@template', '%core.table_prefix%plus_arc_members']
        tags:
            - { name: event.listener }
    phpbb2plus.arcade.discussion:
        class: phpbb2plus\arcade\controller\discussion
        arguments: ['@phpbb2plus.arcade.comments', '@phpbb2plus.arcade.catalog', '@user', '@language', '@template', '@controller.helper', '@request', '@pagination', '@config', '@?phpbb2plus.community.former_members']
    phpbb2plus.arcade.activity:
        class: phpbb2plus\arcade\service\activity
        arguments: ['@dbal.conn', '@phpbb2plus.arcade.catalog', '@user', '%core.table_prefix%plus_arc_']
    phpbb2plus.arcade.catalog:
        class: phpbb2plus\arcade\service\catalog
        arguments: ['@dbal.conn', '@auth', '@user', '%core.table_prefix%plus_arc_']
    phpbb2plus.arcade.wallet:
        class: phpbb2plus\arcade\service\wallet
        arguments: ['@dbal.conn', '@phpbb2plus.arcade.catalog', '%core.table_prefix%plus_arc_']
    phpbb2plus.arcade.board:
        class: phpbb2plus\arcade\controller\board
        arguments: ['@phpbb2plus.arcade.catalog', '@dbal.conn', '@user', '@language', '@template', '@controller.helper', '@request', '@pagination', '%core.table_prefix%plus_arc_', '@phpbb2plus.arcade.wallet', '@phpbb2plus.arcade.activity', '@phpbb2plus.arcade.tournaments', '@phpbb2plus.arcade.standings', '@phpbb2plus.arcade.artwork', '@phpbb2plus.arcade.score_moderation', '@?phpbb2plus.community.former_members', '@?phpbb2plus.community.legacy']
    phpbb2plus.arcade.standings:
        class: phpbb2plus\arcade\service\standings
        arguments: ['@dbal.conn', '@phpbb2plus.arcade.catalog', '@config', '%core.table_prefix%plus_arc_']
    phpbb2plus.arcade.artwork:
        class: phpbb2plus\arcade\service\artwork
        arguments: ['@dbal.conn', '@config', '%core.table_prefix%plus_arc_', '%core.root_path%', '@filesystem']
    phpbb2plus.arcade.import_artwork:
        class: phpbb2plus\arcade\console\import_artwork
        arguments: ['@phpbb2plus.arcade.artwork']
        tags:
            - { name: console.command }
    phpbb2plus.arcade.events:
        class: phpbb2plus\arcade\event\listener
        arguments: ['@language', '@template', '@controller.helper', '@dbal.conn', '%core.table_prefix%plus_arc_', '@phpbb2plus.arcade.protocol']
        tags:
            - { name: event.listener }
    phpbb2plus.arcade.sessions:
        class: phpbb2plus\arcade\service\sessions
        arguments: ['@phpbb2plus.arcade.catalog', '@dbal.conn', '@user', '@config', '%core.table_prefix%plus_arc_', '%core.root_path%', '@phpbb2plus.arcade.wallet', '@phpbb2plus.arcade.tournaments']
    phpbb2plus.arcade.player:
        class: phpbb2plus\arcade\controller\player
        arguments: ['@phpbb2plus.arcade.sessions', '@request', '@language', '@template', '@controller.helper', '@user', '@config', '@phpbb2plus.arcade.catalog']
    phpbb2plus.arcade.results:
        class: phpbb2plus\arcade\service\results
        arguments: ['@dbal.conn', '@phpbb2plus.arcade.catalog', '@user', '@config', '%core.table_prefix%plus_arc_', '@phpbb2plus.arcade.wallet', '@phpbb2plus.arcade.tournaments']
    phpbb2plus.arcade.protocol:
        class: phpbb2plus\arcade\controller\protocol
        arguments: ['@phpbb2plus.arcade.sessions', '@phpbb2plus.arcade.results', '@phpbb2plus.arcade.catalog', '@request', '@symfony_request', '@config', '@controller.helper', '@language']
