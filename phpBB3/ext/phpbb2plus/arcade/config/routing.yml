phpbb2plus_arcade_moderate:
    path: /arcade/moderation
    defaults: { _controller: phpbb2plus.arcade.score_panel:front }
    methods: [GET, HEAD, POST]
phpbb2plus_arcade_monthly:
    path: /arcade/monthly
    defaults: { _controller: phpbb2plus.arcade.board:standings, monthly: true }
    methods: [GET, HEAD]
phpbb2plus_arcade_points:
    path: /arcade/points
    defaults: { _controller: phpbb2plus.arcade.board:standings, monthly: false }
    methods: [GET, HEAD]
phpbb2plus_arcade_legacy_rating:
    path: /arcade/legacy/rating/{game}
    defaults: { _controller: phpbb2plus.arcade.board:legacy_rating }
    requirements: { game: '[1-9][0-9]*' }
    methods: [GET, HEAD]
phpbb2plus_arcade_legacy_comments:
    path: /arcade/legacy/comments
    defaults: { _controller: phpbb2plus.arcade.discussion:legacy }
    methods: [GET, HEAD]
phpbb2plus_arcade_icon:
    path: /arcade/game/{game}/icon
    defaults: { _controller: phpbb2plus.arcade.board:icon }
    requirements: { game: '[1-9][0-9]*' }
    methods: [GET, HEAD]
phpbb2plus_arcade_tournaments:
    path: /arcade/tournaments
    defaults: { _controller: phpbb2plus.arcade.events_board:listing, champions: false }
    methods: [GET, HEAD]
phpbb2plus_arcade_champions:
    path: /arcade/tournaments/champions
    defaults: { _controller: phpbb2plus.arcade.events_board:listing, champions: true }
    methods: [GET, HEAD]
phpbb2plus_arcade_tournament:
    path: /arcade/tournament/{id}
    defaults: { _controller: phpbb2plus.arcade.events_board:detail }
    requirements: { id: '[1-9][0-9]*' }
    methods: [GET, HEAD]
phpbb2plus_arcade_propose:
    path: /arcade/tournaments/propose
    defaults: { _controller: phpbb2plus.arcade.events_board:proposal }
    methods: [GET, POST]
phpbb2plus_arcade_tournament_start:
    path: /arcade/tournament/{tour}/game/{game}/start
    defaults: { _controller: phpbb2plus.arcade.player:start }
    requirements: { tour: '[1-9][0-9]*', game: '[1-9][0-9]*' }
    methods: [POST]
phpbb2plus_arcade_join_tournaments:
    path: /arcade/tournaments/join
    defaults: { _controller: phpbb2plus.arcade.events_board:join, id: 0 }
    methods: [POST]
phpbb2plus_arcade_join_tournament:
    path: /arcade/tournament/{id}/join
    defaults: { _controller: phpbb2plus.arcade.events_board:join }
    requirements: { id: '[1-9][0-9]*' }
    methods: [POST]
phpbb2plus_arcade_index:
    path: /arcade
    defaults: { _controller: phpbb2plus.arcade.board:index, category: 0 }
    methods: [GET, HEAD]
phpbb2plus_arcade_category:
    path: /arcade/category/{category}
    defaults: { _controller: phpbb2plus.arcade.board:index }
    requirements: { category: '[1-9][0-9]*' }
    methods: [GET, HEAD]
phpbb2plus_arcade_favourites:
    path: /arcade/favourites
    defaults: { _controller: phpbb2plus.arcade.board:index, category: 0, favourites: true }
    methods: [GET, HEAD]
phpbb2plus_arcade_feedback:
    path: /arcade/game/{game}/{operation}
    defaults: { _controller: phpbb2plus.arcade.board:feedback }
    requirements: { game: '[1-9][0-9]*', operation: 'favourite|rate' }
    methods: [POST]
phpbb2plus_arcade_awards:
    path: /arcade/player/{member}/awards/{period}
    defaults: { _controller: phpbb2plus.arcade.board:awards, period: current }
    requirements: { member: '[1-9][0-9]*', period: 'current|all' }
    methods: [GET, HEAD]
phpbb2plus_arcade_legacy_awards:
    path: /arcade/legacy/player/{member}/awards/{period}
    defaults: { _controller: phpbb2plus.arcade.board:awards, legacy: true }
    requirements: { member: '[0-9]{1,10}', period: 'current|all' }
    methods: [GET, HEAD]
phpbb2plus_arcade_game:
    path: /arcade/game/{game}
    defaults: { _controller: phpbb2plus.arcade.board:game, board: '' }
    requirements: { game: '[1-9][0-9]*' }
    methods: [GET, HEAD]
phpbb2plus_arcade_comments:
    path: /arcade/game/{game}/comments
    defaults: { _controller: phpbb2plus.arcade.discussion:listing }
    requirements: { game: '[1-9][0-9]*' }
    methods: [GET, HEAD]
phpbb2plus_arcade_add_comment:
    path: /arcade/game/{game}/comments/add
    defaults: { _controller: phpbb2plus.arcade.discussion:change, action: add, comment: 0 }
    requirements: { game: '[1-9][0-9]*' }
    methods: [POST]
phpbb2plus_arcade_change_comment:
    path: /arcade/game/{game}/comments/{comment}/{action}
    defaults: { _controller: phpbb2plus.arcade.discussion:change }
    requirements: { game: '[1-9][0-9]*', comment: '[1-9][0-9]*', action: 'edit|delete' }
    methods: [GET, POST]
phpbb2plus_arcade_scores:
    path: /arcade/game/{game}/scores/{board}
    defaults: { _controller: phpbb2plus.arcade.board:game }
    requirements: { game: '[1-9][0-9]*', board: 'current|all|month' }
    methods: [GET, HEAD]
phpbb2plus_arcade_start:
    path: /arcade/game/{game}/start
    defaults: { _controller: phpbb2plus.arcade.player:start }
    requirements: { game: '[1-9][0-9]*' }
    methods: [POST]
phpbb2plus_arcade_play:
    path: /arcade/game/{game}/play/{launch}
    defaults: { _controller: phpbb2plus.arcade.player:page }
    requirements: { game: '[1-9][0-9]*', launch: '[a-f0-9]{32}' }
    methods: [GET, HEAD]
phpbb2plus_arcade_protocol:
    path: /arcade/game/{game}/media/{launch}/{endpoint}
    defaults: { _controller: phpbb2plus.arcade.protocol:handle }
    requirements: { game: '[1-9][0-9]*', launch: '[a-f0-9]{32}', endpoint: '(?:newscore|IBProArcade|pnFlashGames|arcade|index)\.php' }
    methods: [GET, POST]
phpbb2plus_arcade_asset:
    path: /arcade/game/{game}/media/{launch}/{name}
    defaults: { _controller: phpbb2plus.arcade.player:asset }
    requirements: { game: '[1-9][0-9]*', launch: '[a-f0-9]{32}', name: '.+' }
    methods: [GET, HEAD]
