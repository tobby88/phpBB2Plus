services:
    phpbb2plus.calendar.portal:
        class: phpbb2plus\calendar\event\portal
        arguments: ['@phpbb2plus.calendar.schedule', '@request', '@user', '@auth', '@config', '@language', '@controller.helper', '@template', '%core.root_path%', '%core.php_ext%']
        tags:
            - { name: event.listener }
    phpbb2plus.calendar.day_search:
        class: phpbb2plus\calendar\event\day_search
        arguments: ['@dbal.conn', '@request', '@user', '@auth', '@content.visibility', '@language', '@template', '@pagination']
        tags:
            - { name: event.listener }
    phpbb2plus.calendar.settings:
        class: phpbb2plus\calendar\service\settings
        arguments: ['@config', '@user']
    phpbb2plus.calendar.schedule:
        class: phpbb2plus\calendar\service\schedule
        arguments: ['@dbal.conn', '@auth', '@content.visibility', '@user', '@config', '@phpbb2plus.calendar.settings', '%core.root_path%', '%core.php_ext%']
    phpbb2plus.calendar.board:
        class: phpbb2plus\calendar\controller\board
        arguments: ['@phpbb2plus.calendar.schedule', '@phpbb2plus.calendar.settings', '@request', '@user', '@language', '@controller.helper', '@template', '@pagination']
    phpbb2plus.calendar.navigation:
        class: phpbb2plus\calendar\event\navigation
        arguments: ['@language', '@controller.helper', '@template', '@phpbb2plus.calendar.settings']
        tags:
            - { name: event.listener }
    phpbb2plus.calendar.preferences:
        class: phpbb2plus\calendar\event\preferences
        arguments: ['@phpbb2plus.calendar.settings', '@request', '@language', '@template']
        tags:
            - { name: event.listener }
    phpbb2plus.calendar.posting:
        class: phpbb2plus\calendar\event\posting
        arguments: ['@dbal.conn', '@request', '@auth', '@user', '@language', '@template']
        tags:
            - { name: event.listener }
