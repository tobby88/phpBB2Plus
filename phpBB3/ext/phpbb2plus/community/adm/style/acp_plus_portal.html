<!-- INCLUDE overall_header.html -->
<h1>{L_ACP_PLUS_PORTAL}</h1>
<form id="plus-portal-settings" method="post" action="{U_SAVE}">
<fieldset><legend>{L_ACP_PLUS_PORTAL}</legend>
<dl><dt><label for="plus-welcome">{L_PLUS_PORTAL_WELCOME}</label><br><span>{L_PLUS_PORTAL_WELCOME_HELP}</span></dt>
<dd><textarea id="plus-welcome" name="welcome" rows="7" cols="48">{WELCOME_TEXT}</textarea></dd></dl>
<!-- BEGIN counts --><dl><dt><label for="plus-count-{counts.NAME}">{counts.LABEL}</label></dt><dd>
<input id="plus-count-{counts.NAME}" type="number" min="{counts.MIN}" max="{counts.MAX}" name="{counts.NAME}" value="{counts.VALUE}" required></dd></dl><!-- END counts -->
<dl><dt><label for="picture-categories">{L_PLUS_PORTAL_PICTURE_CATEGORIES}</label><br><span>{L_PLUS_PORTAL_PICTURE_CATEGORIES_HELP}</span></dt>
<dd><input id="picture-categories" type="text" name="picture_categories" value="{PICTURE_CATEGORIES}"></dd></dl>
<dl><dt><label for="picture-personal">{L_PLUS_PORTAL_PICTURE_PERSONAL}</label></dt><dd><select id="picture-personal" name="picture_personal">
<option value="0"{% if not PICTURE_PERSONAL %} selected{% endif %}>{L_NO}</option><option value="1"{% if PICTURE_PERSONAL %} selected{% endif %}>{L_YES}</option></select></dd></dl>
<dl><dt><label for="picture-random">{L_PLUS_PORTAL_PICTURE_RANDOM}</label></dt><dd><select id="picture-random" name="picture_random">
<option value="0"{% if not PICTURE_RANDOM %} selected{% endif %}>{L_NO}</option><option value="1"{% if PICTURE_RANDOM %} selected{% endif %}>{L_YES}</option></select></dd></dl>
<!-- BEGIN lists --><dl><dt><label for="plus-list-{lists.NAME}">{lists.LABEL}</label></dt><dd>
<select id="plus-list-{lists.NAME}" name="{lists.NAME}[]" multiple size="5">
<!-- BEGIN options --><option value="{lists.options.ID}"<!-- IF lists.options.SELECTED --> selected<!-- ENDIF -->>{lists.options.TITLE}</option><!-- END options -->
</select></dd></dl><!-- END lists -->
<dl><dt><label for="plus-shouts">{L_PLUS_SHOUTBOX}</label></dt><dd><select id="plus-shouts" name="shouts">
<option value="0"<!-- IF SHOUTS == 0 --> selected<!-- ENDIF -->>{L_DISABLED}</option>
<option value="1"<!-- IF SHOUTS == 1 --> selected<!-- ENDIF -->>{L_PLUS_PORTAL} · {L_PLUS_PORTAL_EVERYONE}</option>
<option value="2"<!-- IF SHOUTS == 2 --> selected<!-- ENDIF -->>{L_PLUS_PORTAL} · {L_PLUS_PORTAL_MEMBERS}</option>
<option value="3"<!-- IF SHOUTS == 3 --> selected<!-- ENDIF -->>{L_PLUS_SHOUT_BOTH} · {L_PLUS_PORTAL_EVERYONE}</option>
<option value="4"<!-- IF SHOUTS == 4 --> selected<!-- ENDIF -->>{L_PLUS_SHOUT_BOTH} · {L_PLUS_PORTAL_MEMBERS}</option>
<option value="5"<!-- IF SHOUTS == 5 --> selected<!-- ENDIF -->>{L_INDEX} · {L_PLUS_PORTAL_EVERYONE}</option>
<option value="6"<!-- IF SHOUTS == 6 --> selected<!-- ENDIF -->>{L_INDEX} · {L_PLUS_PORTAL_MEMBERS}</option></select></dd></dl>
<dl><dt><label for="plus-stats">{L_STATISTICS}</label></dt><dd><select id="plus-stats" name="stats">
<option value="1"<!-- IF STATS --> selected<!-- ENDIF -->>{L_ENABLED}</option><option value="0"<!-- IF not STATS --> selected<!-- ENDIF -->>{L_DISABLED}</option></select></dd></dl>
</fieldset><fieldset class="submit-buttons"><input type="hidden" name="revision" value="{REVISION}">
<input class="button1" type="submit" name="save" value="{L_SUBMIT}">{S_FORM_TOKEN}</fieldset></form>
<!-- INCLUDE overall_footer.html -->
