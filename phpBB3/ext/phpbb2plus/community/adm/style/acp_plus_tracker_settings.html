{% include 'overall_header.html' %}
<h1>{{ lang('ACP_PLUS_TRACKER_SETTINGS') }}</h1>
<form id="plus-tracker-settings" method="post" action="{{ U_ACTION }}">
	<fieldset><legend>{{ lang('PLUS_LOGIN_SETTINGS') }}</legend>
		<dl><dt><label for="plus-login-history">{{ lang('PLUS_LOGIN_RECORD') }}</label><br><span>{{ lang('PLUS_LOGIN_RECORD_EXPLAIN') }}</span></dt><dd>
			<label><input id="plus-login-history" class="radio" type="radio" name="config[plus_login_history]" value="1"{% if S_HISTORY %} checked{% endif %}> {{ lang('YES') }}</label>
			<label><input class="radio" type="radio" name="config[plus_login_history]" value="0"{% if not S_HISTORY %} checked{% endif %}> {{ lang('NO') }}</label></dd></dl>
		<dl><dt><label for="plus-login-limit">{{ lang('PLUS_LOGIN_LIMIT') }}</label><br><span>{{ lang('PLUS_LOGIN_LIMIT_EXPLAIN') }}</span></dt>
			<dd><input id="plus-login-limit" type="number" name="config[plus_login_limit]" min="1" max="60" value="{{ LOGIN_LIMIT }}"></dd></dl>
		<dl><dt><label for="plus-login-network">{{ lang('PLUS_LOGIN_NETWORK') }}</label><br><span>{{ lang('PLUS_LOGIN_NETWORK_EXPLAIN') }}</span></dt><dd>
			<label><input id="plus-login-network" class="radio" type="radio" name="config[plus_login_network_check]" value="1"{% if S_NETWORK %} checked{% endif %}> {{ lang('YES') }}</label>
			<label><input class="radio" type="radio" name="config[plus_login_network_check]" value="0"{% if not S_NETWORK %} checked{% endif %}> {{ lang('NO') }}</label></dd></dl>
	</fieldset>
	<fieldset class="submit-buttons"><input type="hidden" name="revision" value="{{ REVISION }}">
	<input type="submit" class="button1" value="{{ lang('SUBMIT') }}">{{ S_FORM_TOKEN }}</fieldset>
</form>
{% include 'overall_footer.html' %}
