services:
    phpbb2plus.community.card_bans:
        class: phpbb2plus\community\event\card_bans
        arguments: ['@dbal.conn', '@user', '@config']
        tags:
            - { name: event.listener }
    phpbb2plus.community.warning_cards:
        class: phpbb2plus\community\event\warning_cards
        arguments: ['@dbal.conn', '@config', '@auth', '@user', '@language', '@template', '@request', '@log']
        tags:
            - { name: event.listener }
    phpbb2plus.community.conditional_read:
        class: phpbb2plus\community\auth\conditional_read
        decorates: auth
        arguments: ['@config', '@config_text', '@phpbb2plus.community.junior_admin']
    phpbb2plus.community.junior_admin:
        class: phpbb2plus\community\auth\junior_admin
        arguments: ['@dbal.conn', '%core.table_prefix%plus_jr_delegations']
    phpbb2plus.community.delegations:
        class: phpbb2plus\community\auth\delegations
        arguments: ['@dbal.conn', '%core.table_prefix%', '@phpbb2plus.community.junior_admin', '@log']
    phpbb2plus.community.junior_admin_events:
        class: phpbb2plus\community\event\junior_admin
        arguments: ['@auth', '@user', '@template', '%core.root_path%%core.adm_relative_path%index.%core.php_ext%', '@dbal.conn', '%core.table_prefix%']
        tags:
            - { name: event.listener }
    phpbb2plus.community.delegation_report:
        class: phpbb2plus\community\console\delegation_report
        arguments: ['@dbal.conn', '%core.table_prefix%plus_jr_records']
        tags:
            - { name: console.command }
    phpbb2plus.community.post_delete_policy:
        class: phpbb2plus\community\event\post_delete_policy
        arguments: ['@config', '@auth', '@request', '@language', '@phpbb2plus.community.confirmed_deletions', '@phpbb2plus.community.erased_files']
        tags:
            - { name: event.listener }
    phpbb2plus.community.confirmed_visibility:
        parent: content.visibility
        class: phpbb2plus\community\service\confirmed_visibility
        decorates: content.visibility
        calls:
            - [set_deletions, ['@phpbb2plus.community.confirmed_deletions']]
    phpbb2plus.community.confirmed_deletions:
        class: phpbb2plus\community\service\confirmed_deletions
        arguments: ['@dbal.conn', '@config', '@auth', '@user', '@language', '%core.table_prefix%', '@phpbb2plus.community.erased_files', '@service_container']
    phpbb2plus.community.erased_files:
        class: phpbb2plus\community\service\erased_files
        arguments: ['@dbal.conn', '@config', '%core.root_path%', '%core.table_prefix%', '@service_container']
    phpbb2plus.community.erased_files_cron:
        class: phpbb2plus\community\cron\erased_files
        arguments: ['@phpbb2plus.community.erased_files']
        calls:
            - [set_name, ['phpbb2plus.community.erased_files_cron']]
        tags:
            - { name: cron.task }
    phpbb2plus.community.removed_posts:
        class: phpbb2plus\community\event\removed_posts
        arguments: ['@dbal.conn', '@auth', '@content.visibility', '@config', '@language']
        tags:
            - { name: event.listener }
    phpbb2plus.community.age_pruning:
        class: phpbb2plus\community\service\age_pruning
        arguments: ['@dbal.conn', '@config', '@auth', '@user', '@phpbb2plus.community.confirmed_deletions', '%core.table_prefix%']
    phpbb2plus.community.prune_events:
        class: phpbb2plus\community\event\age_pruning
        arguments: ['@phpbb2plus.community.age_pruning', '@template']
        tags:
            - { name: event.listener }
    phpbb2plus.community.prune_continuation:
        class: phpbb2plus\community\cron\age_pruning
        arguments: ['@phpbb2plus.community.age_pruning']
        calls:
            - [set_name, ['phpbb2plus.community.prune_continuation']]
        tags:
            - { name: cron.task }
    phpbb2plus.community.post_icons:
        class: phpbb2plus\community\event\post_icons
        arguments: ['@dbal.conn', '@config', '@user', '@auth', '@template', '@request', '@cache']
        tags:
            - { name: event.listener }
    phpbb2plus.community.polls:
        class: phpbb2plus\community\event\polls
        arguments: ['@dbal.conn', '@user']
        tags:
            - { name: event.listener }
    phpbb2plus.community.legacy:
        class: phpbb2plus\community\controller\legacy
        arguments: ['@dbal.conn', '@auth', '@user', '%core.root_path%', '%core.php_ext%']
    phpbb2plus.community.legacy_attachment:
        class: phpbb2plus\community\controller\legacy_attachment
        arguments: ['@dbal.conn', '@auth', '@content.visibility', '@config', '@user', '%core.table_prefix%plus_attach_refs', '%core.root_path%', '%core.php_ext%']
    phpbb2plus.community.ranks:
        class: phpbb2plus\community\controller\ranks
        arguments: ['@dbal.conn', '@cache', '@config', '@user', '@auth', '@controller.helper', '@path_helper', '@template', '@language', '@request', '@pagination', '%core.root_path%', '%core.php_ext%']
    phpbb2plus.community.credits:
        class: phpbb2plus\community\controller\credits
        arguments: ['@phpbb2plus.community.credit_entries', '@ext.manager', '@controller.helper', '@template', '@language', '@request', '@pagination']
    phpbb2plus.community.statistics:
        class: phpbb2plus\community\controller\statistics
        arguments: ['@dbal.conn', '@auth', '@content.visibility', '@user', '@config', '@config_text', '@language', '@template', '@controller.helper', '@request', '%core.root_path%', '%core.php_ext%', '@phpbb2plus.community.statistics_attachments', '@phpbb2plus.community.statistics_installation', '@phpbb2plus.community.statistics_smilies']
    phpbb2plus.community.statistics_smilies:
        class: phpbb2plus\community\service\statistics_smilies
        arguments: ['@dbal.conn', '@config', '@user', '@path_helper']
    phpbb2plus.community.topic_print:
        class: phpbb2plus\community\controller\topic_print
        arguments: ['@phpbb2plus.community.topic_reader', '@language', '@request', '@template', '@controller.helper', '%core.php_ext%']
    phpbb2plus.community.topic_reader:
        class: phpbb2plus\community\service\topic_reader
        arguments: ['@dbal.conn', '@auth', '@content.visibility', '@user', '@language', '@controller.helper', '@dispatcher', '@config', '%core.root_path%', '%core.php_ext%']
    phpbb2plus.community.removed_topic:
        class: phpbb2plus\community\controller\removed_topic
        arguments: ['@phpbb2plus.community.topic_reader', '@dbal.conn', '@auth', '@config', '@request', '@language', '@template', '@pagination', '@controller.helper', '%core.root_path%', '%core.php_ext%']
    phpbb2plus.community.removed_topic_links:
        class: phpbb2plus\community\event\removed_topic_links
        arguments: ['@auth', '@request', '@controller.helper', '@content.visibility', '@language']
        tags:
            - { name: event.listener }
    phpbb2plus.community.topic_export:
        class: phpbb2plus\community\controller\topic_export
        arguments: ['@phpbb2plus.community.topic_reader', '@dbal.conn', '@user', '@auth', '@language', '@request', '@config', '%core.table_prefix%']
    phpbb2plus.community.print_links:
        class: phpbb2plus\community\event\print_links
        arguments: ['@auth', '@controller.helper', '@request', '@template', '@user']
        tags:
            - { name: event.listener }
    phpbb2plus.community.statistics_admin:
        class: phpbb2plus\community\service\statistics_admin
        arguments: ['@dbal.conn', '@config', '@config_text', '%tables.config_text%', '@user', '@auth', '@phpbb2plus.community.statistics_installation', '@cache']
    phpbb2plus.community.statistics_installation:
        class: phpbb2plus\community\service\statistics_installation
        arguments: ['@dbal.conn', '@cache', '@config', '@language', '@user', '%core.root_path%', '%core.php_ext%', '%core.table_prefix%']
    phpbb2plus.community.statistics_attachments:
        class: phpbb2plus\community\service\statistics_attachments
        arguments: ['@dbal.conn', '@cache', '@auth', '@config', '@user', '%core.root_path%', '%core.php_ext%']
    phpbb2plus.community.credit_entries:
        class: phpbb2plus\community\service\credit_entries
        arguments: ['@dbal.conn', '%core.table_prefix%plus_credits', '@auth', '@user']
    profilefields.type.plus_multi:
        class: phpbb2plus\community\profile\multiple
        arguments: ['@profilefields.lang_helper', '@request', '@template', '@user']
        tags:
            - { name: profilefield.type }
    phpbb2plus.community.profile_settings:
        class: phpbb2plus\community\event\profile_settings
        arguments: ['@template', '@language']
        tags:
            - { name: event.listener }
    phpbb2plus.community.password:
        class: phpbb2plus\community\password\legacy
        arguments: ['@request']
        tags:
            - { name: passwords.driver }
    phpbb2plus.community.portal:
        class: phpbb2plus\community\controller\portal
        arguments: ['@dbal.conn', '@auth', '@content.visibility', '@user', '@language', '@controller.helper', '@template', '%core.root_path%', '%core.php_ext%', '@phpbb2plus.community.shoutbox', '@dispatcher', '@config', '@config_text', '@path_helper']
    phpbb2plus.community.portal_sessions:
        class: phpbb2plus\community\event\portal_sessions
        arguments: ['@dbal.conn']
        tags:
            - { name: event.listener }
    phpbb2plus.community.navigation:
        class: phpbb2plus\community\event\navigation
        arguments: ['@controller.helper', '@template', '@language', '@request']
        tags:
            - { name: event.listener }
    phpbb2plus.community.bylines:
        class: phpbb2plus\community\event\bylines
        arguments: ['@dbal.conn', '@user', '%core.table_prefix%plus_bylines', '@phpbb2plus.community.former_members']
        tags:
            - { name: event.listener }
    phpbb2plus.community.shoutbox:
        class: phpbb2plus\community\service\shoutbox
        arguments: ['@dbal.conn', '@config', '@user', '@auth', '@language', '%core.table_prefix%plus_shouts']
    phpbb2plus.community.shouts:
        class: phpbb2plus\community\controller\shouts
        arguments: ['@phpbb2plus.community.shoutbox', '@controller.helper', '@template', '@language', '@request', '@pagination']
    phpbb2plus.community.profile:
        class: phpbb2plus\community\event\profile
        arguments: ['@user', '@config', '%core.root_path%', '%core.php_ext%', '@phpbb2plus.community.country_flags', '@path_helper']
        tags:
            - { name: event.listener }
    phpbb2plus.community.country_flags:
        class: phpbb2plus\community\profile\country_flags
        arguments: ['@dbal.conn', '%core.table_prefix%']
    phpbb2plus.community.former_members:
        class: phpbb2plus\community\service\former_members
        arguments: ['@dbal.conn', '@config', '@user', '@language', '%core.table_prefix%plus_former_names']
    phpbb2plus.community.former_names:
        class: phpbb2plus\community\event\former_names
        arguments: ['@phpbb2plus.community.former_members', '@dbal.conn', '%core.table_prefix%']
        tags:
            - { name: event.listener }
    phpbb2plus.community.author_search:
        class: phpbb2plus\community\event\author_search
        arguments: ['@dbal.conn', '@config', '@phpbb2plus.community.former_members', '%core.table_prefix%plus_bylines']
        tags:
            - { name: event.listener }
    phpbb2plus.community.attachment_quotas:
        class: phpbb2plus\community\attachment\quotas
        arguments: ['@dbal.conn', '@config', '%core.table_prefix%plus_attach_']
    phpbb2plus.community.quota_management:
        class: phpbb2plus\community\attachment\management
        arguments: ['@dbal.conn', '@config', '@cache.driver', '%core.table_prefix%plus_attach_']
    phpbb2plus.community.topic_descriptions:
        class: phpbb2plus\community\event\topic_descriptions
        arguments: ['@dbal.conn', '@request', '@language', '@auth', '@user', '@content.visibility', '@config']
        tags:
            - { name: event.listener }
    phpbb2plus.community.announcements:
        class: phpbb2plus\community\service\announcements
        arguments: ['@dbal.conn', '@config']
    phpbb2plus.community.announcement_events:
        class: phpbb2plus\community\event\announcements
        arguments: ['@phpbb2plus.community.announcements', '@config', '@auth', '@request', '@language']
        tags:
            - { name: event.listener }
    phpbb2plus.community.announcement_cron:
        class: phpbb2plus\community\cron\announcements
        arguments: ['@phpbb2plus.community.announcements']
        calls:
            - [set_name, [phpbb2plus.community.announcement_cron]]
        tags:
            - { name: cron.task }
    phpbb2plus.community.attachment_upload:
        class: phpbb2plus\community\attachment\upload
        decorates: attachment.upload
        shared: false
        arguments: ['@phpbb2plus.community.attachment_upload.inner', '@phpbb2plus.community.attachment_quotas', '@attachment.delete', '@user', '@language']
    phpbb2plus.community.attachment_quota_events:
        class: phpbb2plus\community\event\attachment_quotas
        arguments: ['@phpbb2plus.community.attachment_quotas', '@user', '@attachment.delete']
        tags:
            - { name: event.listener }
    phpbb2plus.community.pm_quota_events:
        class: phpbb2plus\community\event\pm_quotas
        arguments: ['@phpbb2plus.community.attachment_quotas', '@dbal.conn', '@user', '@auth', '@language']
        tags:
            - { name: event.listener }
