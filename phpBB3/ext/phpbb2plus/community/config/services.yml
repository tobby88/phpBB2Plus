services:
    phpbb2plus.community.removed_posts:
        class: phpbb2plus\community\event\removed_posts
        arguments: ['@dbal.conn', '@auth', '@content.visibility', '@config', '@language']
        tags:
            - { name: event.listener }
    phpbb2plus.community.post_icons:
        class: phpbb2plus\community\event\post_icons
        arguments: ['@dbal.conn', '@config', '@user', '@auth', '@template', '@request', '@cache']
        tags:
            - { name: event.listener }
    phpbb2plus.community.polls:
        class: phpbb2plus\community\event\polls
        arguments: ['@dbal.conn', '@user']
        tags:
            - { name: event.listener }
    phpbb2plus.community.legacy:
        class: phpbb2plus\community\controller\legacy
        arguments: ['@dbal.conn', '@auth', '@user', '%core.root_path%', '%core.php_ext%']
    profilefields.type.plus_multi:
        class: phpbb2plus\community\profile\multiple
        arguments: ['@profilefields.lang_helper', '@request', '@template', '@user']
        tags:
            - { name: profilefield.type }
    phpbb2plus.community.profile_settings:
        class: phpbb2plus\community\event\profile_settings
        arguments: ['@template', '@language']
        tags:
            - { name: event.listener }
    phpbb2plus.community.password:
        class: phpbb2plus\community\password\legacy
        arguments: ['@request']
        tags:
            - { name: passwords.driver }
    phpbb2plus.community.portal:
        class: phpbb2plus\community\controller\portal
        arguments: ['@dbal.conn', '@auth', '@content.visibility', '@user', '@language', '@controller.helper', '@template', '%core.root_path%', '%core.php_ext%', '@phpbb2plus.community.shoutbox', '@dispatcher', '@config', '@config_text', '@path_helper']
    phpbb2plus.community.portal_sessions:
        class: phpbb2plus\community\event\portal_sessions
        arguments: ['@dbal.conn']
        tags:
            - { name: event.listener }
    phpbb2plus.community.navigation:
        class: phpbb2plus\community\event\navigation
        arguments: ['@controller.helper', '@template', '@language', '@request']
        tags:
            - { name: event.listener }
    phpbb2plus.community.bylines:
        class: phpbb2plus\community\event\bylines
        arguments: ['@dbal.conn', '@user', '%core.table_prefix%plus_bylines', '@phpbb2plus.community.former_members']
        tags:
            - { name: event.listener }
    phpbb2plus.community.shoutbox:
        class: phpbb2plus\community\service\shoutbox
        arguments: ['@dbal.conn', '@config', '@user', '@auth', '@language', '%core.table_prefix%plus_shouts']
    phpbb2plus.community.shouts:
        class: phpbb2plus\community\controller\shouts
        arguments: ['@phpbb2plus.community.shoutbox', '@controller.helper', '@template', '@language', '@request', '@pagination']
    phpbb2plus.community.profile:
        class: phpbb2plus\community\event\profile
        arguments: ['@user', '@config', '%core.root_path%', '%core.php_ext%', '@phpbb2plus.community.country_flags', '@path_helper']
        tags:
            - { name: event.listener }
    phpbb2plus.community.country_flags:
        class: phpbb2plus\community\profile\country_flags
        arguments: ['@dbal.conn', '%core.table_prefix%']
    phpbb2plus.community.former_members:
        class: phpbb2plus\community\service\former_members
        arguments: ['@dbal.conn', '@config', '@user', '@language', '%core.table_prefix%plus_former_names']
    phpbb2plus.community.former_names:
        class: phpbb2plus\community\event\former_names
        arguments: ['@phpbb2plus.community.former_members', '@dbal.conn', '%core.table_prefix%']
        tags:
            - { name: event.listener }
    phpbb2plus.community.author_search:
        class: phpbb2plus\community\event\author_search
        arguments: ['@dbal.conn', '@config', '@phpbb2plus.community.former_members', '%core.table_prefix%plus_bylines']
        tags:
            - { name: event.listener }
    phpbb2plus.community.attachment_quotas:
        class: phpbb2plus\community\attachment\quotas
        arguments: ['@dbal.conn', '@config', '%core.table_prefix%plus_attach_']
    phpbb2plus.community.quota_management:
        class: phpbb2plus\community\attachment\management
        arguments: ['@dbal.conn', '@config', '@cache.driver', '%core.table_prefix%plus_attach_']
    phpbb2plus.community.attachment_upload:
        class: phpbb2plus\community\attachment\upload
        decorates: attachment.upload
        shared: false
        arguments: ['@phpbb2plus.community.attachment_upload.inner', '@phpbb2plus.community.attachment_quotas', '@attachment.delete', '@user', '@language']
    phpbb2plus.community.attachment_quota_events:
        class: phpbb2plus\community\event\attachment_quotas
        arguments: ['@phpbb2plus.community.attachment_quotas', '@user', '@attachment.delete']
        tags:
            - { name: event.listener }
    phpbb2plus.community.pm_quota_events:
        class: phpbb2plus\community\event\pm_quotas
        arguments: ['@phpbb2plus.community.attachment_quotas', '@dbal.conn', '@user', '@auth', '@language']
        tags:
            - { name: event.listener }
