phpbb2plus_community_forum_link:
    path: /{alias}.html
    defaults: { _controller: phpbb2plus.community.legacy:forum_link }
    requirements: { alias: '(?:forums|(?:forumc?|viewforum|[fpn]topic|fpost)[1-9][a-z0-9,-]*)' }
    methods: [GET, HEAD]
phpbb2plus_community_member_link:
    path: /legacy/member/{source}/{mode}
    defaults: { _controller: phpbb2plus.community.legacy:member_link }
    requirements: { source: '[1-9][0-9]{0,9}', mode: 'viewprofile|email' }
    methods: [GET, HEAD]
phpbb2plus_community_portal:
    path: /portal
    defaults: { _controller: phpbb2plus.community.portal:handle }
    methods: [GET, HEAD]
phpbb2plus_community_credits:
    path: /credits
    defaults: { _controller: phpbb2plus.community.credits:show }
    methods: [GET, HEAD]
phpbb2plus_community_shouts:
    path: /shoutbox
    defaults: { _controller: phpbb2plus.community.shouts:show }
    methods: [GET, HEAD]
phpbb2plus_community_shout_write:
    path: /shoutbox
    defaults: { _controller: phpbb2plus.community.shouts:write }
    methods: [POST]
