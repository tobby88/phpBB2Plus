phpbb2plus_community_birthday:
    path: /birthday
    defaults: { _controller: phpbb2plus.community.birthday:view }
    methods: [GET, HEAD]
phpbb2plus_community_member_attachments:
    path: /legacy/member/{source}/attachments/{sort}/{direction}/{start}
    defaults: { _controller: phpbb2plus.community.member_attachments:bookmark }
    requirements: { source: '[1-9][0-9]{0,7}', sort: '[a-f]', direction: '[ad]', start: '[0-9]{1,10}' }
    methods: [GET, HEAD]
phpbb2plus_community_attachment_rules:
    path: /attachment/rules/{forum}
    defaults: { _controller: phpbb2plus.community.attachment_rules:show }
    requirements: { forum: '0|[1-9][0-9]{0,9}' }
    methods: [GET, HEAD]
phpbb2plus_community_forum_link:
    path: /{alias}.html
    defaults: { _controller: phpbb2plus.community.legacy:forum_link }
    requirements: { alias: '(?:forums|(?:forumc?|viewforum|[fpn]topic|fpost)[1-9][a-z0-9,-]*)' }
    methods: [GET, HEAD]
phpbb2plus_community_member_link:
    path: /legacy/member/{source}/{mode}
    defaults: { _controller: phpbb2plus.community.legacy:member_link }
    requirements: { source: '[1-9][0-9]{0,9}', mode: 'viewprofile|email' }
    methods: [GET, HEAD]
phpbb2plus_community_group_link:
    path: /legacy/group/{source}/{view}/{start}
    defaults: { _controller: phpbb2plus.community.legacy:group_link }
    requirements: { source: '[1-9][0-9]{0,9}', view: 'members|requests', start: '[0-9]{1,10}' }
    methods: [GET, HEAD]
phpbb2plus_community_group_lead:
    path: /groups/{group}/lead
    defaults: { _controller: 'phpbb2plus.community.group_lead:show' }
    requirements: { group: '[1-9][0-9]{0,9}' }
    methods: [GET, HEAD, POST]
phpbb2plus_community_group_withdraw:
    path: /groups/{group}/leave
    defaults: { _controller: 'phpbb2plus.community.group_withdrawal:show' }
    requirements: { group: '[1-9][0-9]{0,9}' }
    methods: [GET, HEAD, POST]
phpbb2plus_community_portal:
    path: /portal
    defaults: { _controller: phpbb2plus.community.portal:handle }
    methods: [GET, HEAD]
phpbb2plus_community_moderation_bookmark:
    path: /legacy/moderation/{view}/{kind}/{id}/{start}
    defaults: { _controller: phpbb2plus.community.legacy:moderation }
    requirements: { view: 'forum|topic|merge|split|ip', kind: 'none|forum|topic|post', id: '[0-9]{1,8}', start: '[0-9]{1,10}' }
    methods: [GET, HEAD]
phpbb2plus_community_recent:
    path: /topics/recent
    defaults: { _controller: phpbb2plus.community.recent:view }
    methods: [GET, HEAD]
phpbb2plus_community_member_notice_read:
    path: /member-notice/read
    defaults: { _controller: phpbb2plus.community.member_notice_form:acknowledge }
    methods: [POST]
phpbb2plus_community_statistics:
    path: /statistics
    defaults: { _controller: phpbb2plus.community.statistics:show }
    methods: [GET, HEAD]
phpbb2plus_community_topic_print:
    path: /topic/{topic_id}/print
    defaults: { _controller: phpbb2plus.community.topic_print:show }
    requirements: { topic_id: '[1-9][0-9]{0,9}' }
    methods: [GET, HEAD, POST]
phpbb2plus_community_topic_export:
    path: /topic/{topic_id}/export.txt
    defaults: { _controller: phpbb2plus.community.topic_export:download, post_id: 0 }
    requirements: { topic_id: '[1-9][0-9]{0,9}' }
    methods: [GET, HEAD, POST]
phpbb2plus_community_post_print:
    path: /post/{post_id}/topic/print
    defaults: { _controller: phpbb2plus.community.topic_print:show, topic_id: 0 }
    requirements: { post_id: '[1-9][0-9]{0,9}' }
    methods: [GET, HEAD, POST]
phpbb2plus_community_removed_topic:
    path: /topic/{topic_id}/removed
    defaults: { _controller: phpbb2plus.community.removed_topic:show, post_id: 0 }
    requirements: { topic_id: '[1-9][0-9]{0,9}' }
    methods: [GET, HEAD, POST]
phpbb2plus_community_removed_post:
    path: /post/{post_id}/removed
    defaults: { _controller: phpbb2plus.community.removed_topic:show, topic_id: 0 }
    requirements: { post_id: '[1-9][0-9]{0,9}' }
    methods: [GET, HEAD, POST]
phpbb2plus_community_topic_readers:
    path: /topic/{topic_id}/readers
    defaults: { _controller: phpbb2plus.community.topic_readers:show }
    requirements: { topic_id: '[1-9][0-9]{0,9}' }
    methods: [GET, HEAD, POST]
phpbb2plus_community_post_export:
    path: /post/{post_id}/topic.txt
    defaults: { _controller: phpbb2plus.community.topic_export:download, topic_id: 0 }
    requirements: { post_id: '[1-9][0-9]{0,9}' }
    methods: [GET, HEAD, POST]
phpbb2plus_community_legacy_message:
    path: /legacy/pm/{mode}/{source}
    defaults: { _controller: phpbb2plus.community.legacy:message }
    requirements: { mode: 'read|post|reply|quote|edit', source: '[1-9][0-9]{0,9}' }
    methods: [GET, HEAD]
phpbb2plus_community_legacy_savebox:
    path: /legacy/pm/savebox/{start}
    defaults: { _controller: phpbb2plus.community.legacy:savebox }
    requirements: { start: '[0-9]{1,10}' }
    methods: [GET, HEAD]
phpbb2plus_community_legacy_attachment:
    path: /legacy/attachment/{source}/{format}
    defaults: { _controller: phpbb2plus.community.legacy_attachment:show }
    requirements: { source: '[1-9][0-9]{0,9}', format: 'file|thumb' }
    methods: [GET, HEAD]
phpbb2plus_community_credits:
    path: /credits
    defaults: { _controller: phpbb2plus.community.credits:show }
    methods: [GET, HEAD]
phpbb2plus_community_ranks:
    path: /ranks
    defaults: { _controller: phpbb2plus.community.ranks:show }
    methods: [GET, HEAD]
phpbb2plus_community_shouts:
    path: /shoutbox
    defaults: { _controller: phpbb2plus.community.shouts:show }
    methods: [GET, HEAD]
phpbb2plus_community_shout_recent:
    path: /shoutbox/recent/{place}
    defaults: { _controller: phpbb2plus.community.shouts:recent }
    requirements: { place: 'portal|index' }
    methods: [GET, HEAD]
phpbb2plus_community_shout_write:
    path: /shoutbox
    defaults: { _controller: phpbb2plus.community.shouts:write }
    methods: [POST]
phpbb2plus_community_friend:
    path: /recommend
    defaults: { _controller: phpbb2plus.community.board_mail:board }
    methods: [GET, HEAD, POST]
phpbb2plus_community_absence:
    path: /absence
    defaults: { _controller: phpbb2plus.community.absence_editor:own }
    methods: [GET, HEAD, POST]
phpbb2plus_community_smilie_creator:
    path: /smilie-creator
    defaults: { _controller: phpbb2plus.community.smilie_creator:show }
    methods: [GET, HEAD, POST]
