<!-- IF U_PLUS_SHOUTBOX -->
<!-- INCLUDECSS @phpbb2plus_community/shout_panel.css -->
<!-- INCLUDEJS @phpbb2plus_community/shout_panel.js -->
<section class="panel" id="plus-shout-panel"><div class="inner">
	<h3><a href="{U_PLUS_SHOUTBOX}">{L_PLUS_SHOUTBOX}</a>
		<a class="plus-shout-refresh" data-url="{U_PLUS_SHOUT_RECENT}" href="{% if PLUS_SHOUT_PLACE == 'index' %}{{ U_INDEX }}{% else %}{{ U_PLUS_PORTAL }}{% endif %}#plus-shout-panel">{L_PLUS_SHOUT_REFRESH}</a></h3>
	<!-- INCLUDE @phpbb2plus_community/shout_messages.html -->
	<p class="error" id="plus-shout-refresh-error" role="status" hidden>{L_PLUS_SHOUT_REFRESH_ERROR}</p>
	<!-- IF U_PLUS_SHOUT_QUICK -->
	<form method="post" action="{U_PLUS_SHOUT_QUICK}" id="plus-shout-quick">
		<label for="plus-quick-message">{L_MESSAGE}</label>
		<textarea id="plus-quick-message" class="inputbox" name="message" rows="2" maxlength="16000" required></textarea>
		<input type="hidden" name="action" value="post"><input type="hidden" name="place" value="{PLUS_SHOUT_PLACE}">
		<button type="submit" class="button2">{L_SUBMIT}</button>{S_FORM_TOKEN_PLUS_SHOUT}
	</form>
	<!-- ENDIF -->
</div></section>
<!-- ENDIF -->
