{% for pref in loops.plus_editor_prefs %}
<dl><dt><label for="{{ pref.OPTION }}">{{ pref.LABEL }}{{ lang('COLON') }}</label></dt>
<dd><select id="{{ pref.OPTION }}" name="{{ pref.OPTION }}">
	<option value="-1"{% if pref.VALUE == -1 %} selected{% endif %}>{{ lang('PLUS_INLINE_INHERIT') }}</option>
	<option value="1"{% if pref.VALUE == 1 %} selected{% endif %}>{{ lang('YES') }}</option>
	<option value="0"{% if pref.VALUE == 0 %} selected{% endif %}>{{ lang('NO') }}</option>
</select></dd></dl>
{% endfor %}
