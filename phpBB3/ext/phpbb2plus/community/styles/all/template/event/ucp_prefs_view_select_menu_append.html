{% if S_PLUS_INLINE_PREF %}
<dl><dt><label for="plus-inline-preference">{{ lang('PLUS_INLINE_TITLE') }}{{ lang('COLON') }}</label></dt>
<dd><select id="plus-inline-preference" name="plus_inline_edit">
	<option value="-1"{% if PLUS_INLINE_CHOICE == -1 %} selected{% endif %}>{{ lang('PLUS_INLINE_INHERIT') }}</option>
	<option value="1"{% if PLUS_INLINE_CHOICE == 1 %} selected{% endif %}>{{ lang('YES') }}</option>
	<option value="0"{% if PLUS_INLINE_CHOICE == 0 %} selected{% endif %}>{{ lang('NO') }}</option>
</select></dd></dl>
{% endif %}
