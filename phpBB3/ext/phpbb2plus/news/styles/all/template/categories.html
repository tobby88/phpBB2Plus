<!-- INCLUDE overall_header.html -->
<!-- INCLUDECSS @phpbb2plus_news/news.css -->
<h2>{L_PLUS_NEWS_CATEGORIES}</h2>
<p><a href="{U_PLUS_NEWS}">{L_PLUS_NEWS_ARCHIVE}</a></p>
{% if loops.news_categories %}
<ul class="plus-news-categories">
{% for category in loops.news_categories %}
	<li class="panel"><a class="plus-news-category-link" href="{{ category.U_CATEGORY }}">
		{% if category.IMAGE %}<img src="{{ category.IMAGE }}" alt="" loading="lazy">{% endif %}
		<span class="forumtitle">{{ category.CATEGORY }} ({{ category.COUNT }})</span>
	</a></li>
{% endfor %}
</ul>
{% else %}
<p class="panel">{{ lang('PLUS_NEWS_EMPTY') }}</p>
{% endif %}
<!-- INCLUDE overall_footer.html -->
