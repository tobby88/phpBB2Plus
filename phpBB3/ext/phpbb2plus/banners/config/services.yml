services:
    phpbb2plus.banners.catalog:
        class: phpbb2plus\banners\service\catalog
        arguments: ['@dbal.conn', '@config', '@auth', '@user', '@request', '@language', '%core.table_prefix%plus_banner', '%core.root_path%']
    phpbb2plus.banners.template:
        class: phpbb2plus\banners\service\placements
        arguments: ['@phpbb2plus.banners.catalog']
        tags:
            - { name: twig.extension }
    phpbb2plus.banners.events:
        class: phpbb2plus\banners\event\listener
        arguments: ['@phpbb2plus.banners.catalog', '@dbal.conn', '%core.table_prefix%plus_banner']
        tags:
            - { name: event.listener }
    phpbb2plus.banners.delivery:
        class: phpbb2plus\banners\controller\delivery
        arguments: ['@phpbb2plus.banners.catalog', '@dbal.conn', '@config', '@user', '@request', '%core.table_prefix%plus_banner']
    phpbb2plus.banners.management:
        class: phpbb2plus\banners\service\management
        arguments: ['@dbal.conn', '@auth', '@user', '%core.table_prefix%plus_banner']
