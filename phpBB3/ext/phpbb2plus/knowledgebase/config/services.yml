services:
    phpbb2plus.knowledgebase.settings:
        class: phpbb2plus\knowledgebase\service\settings
        arguments: ['@phpbb2plus.knowledgebase.articles', '@phpbb2plus.knowledgebase.editor', '@dbal.conn', '@auth', '@user', '%core.table_prefix%plus_kb_settings']
    phpbb2plus.knowledgebase.categories:
        class: phpbb2plus\knowledgebase\service\categories
        arguments: ['@phpbb2plus.knowledgebase.articles', '@phpbb2plus.knowledgebase.editor', '@phpbb2plus.knowledgebase.publication', '@dbal.conn', '@auth', '%core.table_prefix%plus_kb_']
    phpbb2plus.knowledgebase.articles:
        class: phpbb2plus\knowledgebase\service\articles
        arguments: ['@dbal.conn', '@auth', '@user', '@content.visibility', '%core.table_prefix%plus_kb_']
    phpbb2plus.knowledgebase.board:
        class: phpbb2plus\knowledgebase\controller\board
        arguments: ['@phpbb2plus.knowledgebase.articles', '@dbal.conn', '@user', '@language', '@template', '@controller.helper', '@request', '@pagination', '%core.table_prefix%plus_kb_', '%core.root_path%', '%core.php_ext%', '@phpbb2plus.knowledgebase.editor', '@phpbb2plus.knowledgebase.replies', '@?phpbb2plus.community.former_members', '@dispatcher']
    phpbb2plus.knowledgebase.replies:
        class: phpbb2plus\knowledgebase\service\replies
        arguments: ['@dbal.conn', '@auth', '@user', '@config', '@content.visibility', '@dispatcher', '@profilefields.manager']
    phpbb2plus.knowledgebase.events:
        class: phpbb2plus\knowledgebase\event\listener
        arguments: ['@controller.helper', '@template', '@language', '@dbal.conn', '%core.table_prefix%plus_kb_']
        tags:
            - { name: event.listener }
    phpbb2plus.knowledgebase.editor:
        class: phpbb2plus\knowledgebase\service\editor
        arguments: ['@phpbb2plus.knowledgebase.articles', '@dbal.conn', '@config', '@user', '@auth', '%core.table_prefix%plus_kb_', '%core.root_path%', '%core.php_ext%', '@phpbb2plus.knowledgebase.publication']
    phpbb2plus.knowledgebase.compose:
        class: phpbb2plus\knowledgebase\controller\editor
        arguments: ['@phpbb2plus.knowledgebase.editor', '@phpbb2plus.knowledgebase.articles', '@request', '@user', '@language', '@controller.helper', '@template']
    phpbb2plus.knowledgebase.publication:
        class: phpbb2plus\knowledgebase\service\publication
        arguments: ['@phpbb2plus.knowledgebase.articles', '@dbal.conn', '@auth', '@user', '@config', '@language', '%core.table_prefix%plus_kb_', '%core.root_path%', '%core.php_ext%']
    phpbb2plus.knowledgebase.notices:
        class: phpbb2plus\knowledgebase\cron\notices
        arguments: ['@dbal.conn', '@config', '@phpbb2plus.knowledgebase.articles', '%core.table_prefix%plus_kb_', '%core.root_path%', '%core.php_ext%']
        calls:
            - [set_name, [phpbb2plus.knowledgebase.notices]]
        tags:
            - { name: cron.task }
