<!-- INCLUDE @phpbb2plus_downloads/header.html -->
<h2>{L_PLUS_DL_ADVANCED}</h2>
<!-- INCLUDE @phpbb2plus_downloads/report_links.html -->
{% if DL_EXPIRED %}<p class="notice">{L_PLUS_DL_SEARCH_EXPIRED}</p>{% endif %}
{% if DL_MATCHES %}<h3 id="dl-search-count">{{ DL_MATCHES|e }}</h3>{% endif %}
{% if loops.ranked %}<!-- INCLUDE @phpbb2plus_downloads/result_rows.html -->{% endif %}
{% if loops.pagination %}<div class="pagination"><!-- INCLUDE pagination.html --></div>{% endif %}
<form id="dl-advanced" class="panel" method="post" action="{U_DL_FORM}"><div class="inner"><fieldset class="fields2">
<dl><dt><label for="dl-words">{L_PLUS_DL_WORDS}</label><br><span>{L_PLUS_DL_WORDS_HELP}</span></dt><dd><input class="inputbox" type="search" id="dl-words" name="search_keywords" value="{{ DL_KEYWORDS|e('html_attr') }}" maxlength="500"></dd></dl>
<dl><dt><label for="dl-terms">{L_PLUS_DL_MATCH}</label></dt><dd><select name="search_terms" id="dl-terms"><option value="any"{% if not DL_ALL %} selected{% endif %}>{L_PLUS_DL_ANY}</option><option value="all"{% if DL_ALL %} selected{% endif %}>{L_PLUS_DL_ALL}</option></select></dd></dl>
<dl><dt><label for="dl-author">{L_PLUS_DL_PUBLISHER}</label><br><span>{L_PLUS_DL_AUTHOR_HELP}</span></dt><dd><input class="inputbox" type="text" id="dl-author" name="search_author" value="{{ DL_AUTHOR|e('html_attr') }}" maxlength="100"></dd></dl>
<dl><dt><label for="dl-cat">{L_PLUS_DL_CATEGORY}</label></dt><dd><select id="dl-cat" name="cat_id"><option value="0">{L_PLUS_DL_ALL_CATEGORIES}</option>
{% for cat in loops.categories %}<option value="{{ cat.ID }}"{% if cat.SELECTED %} selected{% endif %}>{{ cat.TITLE|e }}</option>{% endfor %}</select></dd></dl>
<dl><dt><label for="dl-comments">{L_PLUS_DL_SEARCH_COMMENTS}</label></dt><dd><select id="dl-comments" name="comments_search"><option value="YES"{% if DL_COMMENTS %} selected{% endif %}>{L_YES}</option><option value="NO"{% if not DL_COMMENTS %} selected{% endif %}>{L_NO}</option></select></dd></dl>
<dl><dt><label for="dl-sort">{L_SORT_BY}</label></dt><dd><!-- INCLUDE @phpbb2plus_downloads/sort_controls.html --></dd></dl>
</fieldset><fieldset class="submit-buttons"><button class="button1" type="submit">{L_SEARCH}</button></fieldset></div></form>
<!-- INCLUDE @phpbb2plus_downloads/footer.html -->
