services:
    phpbb2plus.downloads.access:
        class: phpbb2plus\downloads\service\access
        arguments: ['@dbal.conn', '@auth', '@user', '%core.table_prefix%plus_dl_']
    phpbb2plus.downloads.library:
        class: phpbb2plus\downloads\controller\library
        arguments: ['@phpbb2plus.downloads.access', '@dbal.conn', '@user', '@language', '@template', '@controller.helper', '@request', '@pagination', '@phpbb2plus.downloads.feedback', '%core.table_prefix%plus_dl_']
    phpbb2plus.downloads.feedback:
        class: phpbb2plus\downloads\service\feedback
        arguments: ['@phpbb2plus.downloads.access', '@dbal.conn', '@user', '@config', '@text_formatter.renderer', '%core.table_prefix%plus_dl_']
    phpbb2plus.downloads.actions:
        class: phpbb2plus\downloads\controller\actions
        arguments: ['@phpbb2plus.downloads.access', '@phpbb2plus.downloads.feedback', '@request', '@controller.helper', '@language', '@template']
    phpbb2plus.downloads.delivery:
        class: phpbb2plus\downloads\controller\delivery
        arguments: ['@phpbb2plus.downloads.access', '@dbal.conn', '@user', '@language', '@template', '@controller.helper', '@request', '@symfony_request', '@config', '%core.table_prefix%plus_dl_', '%core.root_path%']
    phpbb2plus.downloads.events:
        class: phpbb2plus\downloads\event\listener
        arguments: ['@controller.helper', '@template', '@language', '@dbal.conn', '%core.table_prefix%plus_dl_']
        tags:
            - { name: event.listener }
