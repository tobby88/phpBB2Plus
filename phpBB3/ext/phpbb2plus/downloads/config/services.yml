services:
    phpbb2plus.downloads.moderation_controller:
        class: phpbb2plus\downloads\controller\moderation
        arguments: ['@phpbb2plus.downloads.access', '@phpbb2plus.downloads.submissions', '@dbal.conn', '%core.table_prefix%plus_dl_', '@request', '@language', '@template', '@controller.helper', '@pagination', '@phpbb2plus.downloads.public_listing']
    phpbb2plus.downloads.file_checker:
        class: phpbb2plus\downloads\service\file_checker
        arguments: ['@phpbb2plus.downloads.access', '@dbal.conn', '@config', '%core.table_prefix%plus_dl_', '%core.root_path%']
    phpbb2plus.downloads.recommendations:
        class: phpbb2plus\downloads\service\recommendations
        arguments: ['@phpbb2plus.downloads.access', '@dbal.conn', '@config', '@user', '@auth', '@request', '%core.table_prefix%plus_dl_mail_receipts', '%core.root_path%', '%core.php_ext%']
        tags: [{ name: event.listener }]
    phpbb2plus.downloads.recommend_controller:
        class: phpbb2plus\downloads\controller\recommend
        arguments: ['@phpbb2plus.downloads.recommendations', '@phpbb2plus.downloads.access', '@phpbb2plus.downloads.public_listing', '@user', '@language', '@template', '@controller.helper', '@request', '@config']
    phpbb2plus.downloads.file_search:
        class: phpbb2plus\downloads\service\file_search
        arguments: ['@dbal.conn', '@phpbb2plus.downloads.access', '%core.table_prefix%plus_dl_', '@config']
    phpbb2plus.downloads.search_results:
        class: phpbb2plus\downloads\service\search_results
        arguments: ['@dbal.conn', '@config', '@user', '%core.table_prefix%plus_dl_searches']
        tags:
            - { name: event.listener }
    phpbb2plus.downloads.search_controller:
        class: phpbb2plus\downloads\controller\search
        arguments: ['@phpbb2plus.downloads.file_search', '@phpbb2plus.downloads.search_results', '@phpbb2plus.downloads.report_data', '@phpbb2plus.downloads.public_listing', '@phpbb2plus.downloads.access', '@user', '@language', '@template', '@controller.helper', '@request', '@pagination']
    phpbb2plus.downloads.public_listing:
        class: phpbb2plus\downloads\service\public_listing
        arguments: ['@phpbb2plus.downloads.access', '@user', '@language', '@template', '@controller.helper', '@path_helper']
    phpbb2plus.downloads.report_data:
        class: phpbb2plus\downloads\service\report_data
        arguments: ['@dbal.conn', '@phpbb2plus.downloads.access', '%core.table_prefix%plus_dl_']
    phpbb2plus.downloads.reports:
        class: phpbb2plus\downloads\controller\reports
        arguments: ['@phpbb2plus.downloads.report_data', '@phpbb2plus.downloads.access', '@user', '@language', '@template', '@controller.helper', '@request', '@pagination', '@phpbb2plus.downloads.public_listing']
    phpbb2plus.downloads.settings:
        class: phpbb2plus\downloads\service\settings
        arguments: ['@dbal.conn', '@phpbb2plus.downloads.access', '@user', '@log', '%core.table_prefix%plus_dl_']
    phpbb2plus.downloads.file_list:
        class: phpbb2plus\downloads\service\file_list
        arguments: ['@dbal.conn', '%core.table_prefix%plus_dl_']
    phpbb2plus.downloads.file_actions:
        class: phpbb2plus\downloads\service\file_actions
        arguments: ['@dbal.conn', '@phpbb2plus.downloads.access', '@phpbb2plus.downloads.submissions', '@user', '@log', '%core.table_prefix%plus_dl_']
    phpbb2plus.downloads.mirrors:
        class: phpbb2plus\downloads\service\mirrors
        arguments: ['@dbal.conn', '@phpbb2plus.downloads.access', '@phpbb2plus.downloads.media', '@user', '@log', '%core.table_prefix%plus_dl_']
    phpbb2plus.downloads.fields:
        class: phpbb2plus\downloads\service\fields
        arguments: ['@dbal.conn', '@phpbb2plus.downloads.access', '@user', '@log', '%core.table_prefix%plus_dl_']
    phpbb2plus.downloads.licenses:
        class: phpbb2plus\downloads\service\licenses
        arguments: ['@dbal.conn', '@phpbb2plus.downloads.access', '@user', '@log', '%core.table_prefix%plus_dl_']
    phpbb2plus.downloads.permissions:
        class: phpbb2plus\downloads\service\permissions
        arguments: ['@dbal.conn', '@phpbb2plus.downloads.access', '@phpbb2plus.downloads.catalogue', '@user', '@log', '%core.table_prefix%plus_dl_']
    phpbb2plus.downloads.catalogue:
        class: phpbb2plus\downloads\service\catalogue
        arguments: ['@dbal.conn', '@phpbb2plus.downloads.access', '@phpbb2plus.downloads.submissions', '%core.table_prefix%plus_dl_']
    phpbb2plus.downloads.submissions_controller:
        class: phpbb2plus\downloads\controller\submissions
        arguments: ['@phpbb2plus.downloads.access', '@phpbb2plus.downloads.submissions', '@dbal.conn', '@request', '@user', '@controller.helper', '@template', '@language', '@pagination', '%core.table_prefix%plus_dl_', '@phpbb2plus.downloads.public_listing']
    phpbb2plus.downloads.submissions:
        class: phpbb2plus\downloads\service\submissions
        arguments: ['@phpbb2plus.downloads.access', '@phpbb2plus.downloads.media', '@dbal.conn', '@user', '@config', '%core.table_prefix%plus_dl_', '@log']
    phpbb2plus.downloads.media:
        class: phpbb2plus\downloads\service\media
        arguments: ['@phpbb2plus.downloads.access', '@dbal.conn', '@config', '%core.table_prefix%plus_dl_', '%core.root_path%']
    phpbb2plus.downloads.cleanup:
        class: phpbb2plus\downloads\cron\cleanup
        arguments: ['@phpbb2plus.downloads.media', '@dbal.conn', '@config', '%core.table_prefix%plus_dl_']
        calls:
            - [set_name, [phpbb2plus.downloads.cleanup]]
        tags:
            - { name: cron.task }
    phpbb2plus.downloads.portal:
        class: phpbb2plus\downloads\event\portal
        arguments: ['@phpbb2plus.downloads.access', '@dbal.conn', '@config', '@template', '@controller.helper', '@language', '%core.table_prefix%plus_dl_files']
        tags:
            - { name: event.listener }
    phpbb2plus.downloads.access:
        class: phpbb2plus\downloads\service\access
        arguments: ['@dbal.conn', '@auth', '@user', '%core.table_prefix%plus_dl_']
    phpbb2plus.downloads.library:
        class: phpbb2plus\downloads\controller\library
        arguments: ['@phpbb2plus.downloads.access', '@dbal.conn', '@user', '@language', '@template', '@controller.helper', '@request', '@pagination', '@phpbb2plus.downloads.feedback', '%core.table_prefix%plus_dl_', '@path_helper', '@phpbb2plus.downloads.public_listing', '@phpbb2plus.downloads.recommendations']
    phpbb2plus.downloads.catalogue_controller:
        class: phpbb2plus\downloads\controller\catalogue
        arguments: ['@phpbb2plus.downloads.access', '@phpbb2plus.downloads.report_data', '@phpbb2plus.downloads.public_listing', '@dbal.conn', '@user', '@language', '@template', '@controller.helper', '@request', '@pagination']
    phpbb2plus.downloads.feedback:
        class: phpbb2plus\downloads\service\feedback
        arguments: ['@phpbb2plus.downloads.access', '@dbal.conn', '@user', '@config', '@text_formatter.renderer', '%core.table_prefix%plus_dl_', '@symfony_request']
    phpbb2plus.downloads.actions:
        class: phpbb2plus\downloads\controller\actions
        arguments: ['@phpbb2plus.downloads.access', '@phpbb2plus.downloads.feedback', '@request', '@controller.helper', '@language', '@template', '@phpbb2plus.downloads.public_listing']
    phpbb2plus.downloads.delivery:
        class: phpbb2plus\downloads\controller\delivery
        arguments: ['@phpbb2plus.downloads.access', '@dbal.conn', '@user', '@language', '@template', '@controller.helper', '@request', '@symfony_request', '@config', '%core.table_prefix%plus_dl_', '%core.root_path%', '@path_helper', '@phpbb2plus.downloads.public_listing']
    phpbb2plus.downloads.events:
        class: phpbb2plus\downloads\event\listener
        arguments: ['@controller.helper', '@template', '@language', '@dbal.conn', '%core.table_prefix%plus_dl_']
        tags:
            - { name: event.listener }
