phpbb2plus_downloads_index:
    path: /downloads
    defaults: { _controller: phpbb2plus.downloads.catalogue_controller:view, category: 0 }
    methods: [GET, HEAD]
phpbb2plus_downloads_viewall:
    path: /downloads/all
    defaults: { _controller: phpbb2plus.downloads.catalogue_controller:view, category: 0, all: true }
    methods: [GET, HEAD, POST]
phpbb2plus_downloads_stats:
    path: /downloads/stats
    defaults: { _controller: phpbb2plus.downloads.reports:stats }
    methods: [GET, HEAD]
phpbb2plus_downloads_search:
    path: /downloads/search
    defaults: { _controller: phpbb2plus.downloads.search_controller:view }
    methods: [GET, HEAD, POST]
phpbb2plus_downloads_toplist:
    path: /downloads/toplist
    defaults: { _controller: phpbb2plus.downloads.reports:toplist }
    methods: [GET, HEAD]
phpbb2plus_downloads_destinations:
    path: /downloads/submit
    defaults: { _controller: phpbb2plus.downloads.submissions_controller:choose }
    methods: [GET]
phpbb2plus_downloads_submit:
    path: /downloads/category/{category}/submit
    defaults: { _controller: phpbb2plus.downloads.submissions_controller:form }
    requirements: { category: '[1-9][0-9]*' }
    methods: [GET, POST]
phpbb2plus_downloads_queue:
    path: /downloads/category/{category}/review
    defaults: { _controller: phpbb2plus.downloads.submissions_controller:queue }
    requirements: { category: '[1-9][0-9]*' }
    methods: [GET]
phpbb2plus_downloads_edit:
    path: /downloads/file/{file}/edit
    defaults: { _controller: phpbb2plus.downloads.submissions_controller:edit }
    requirements: { file: '[1-9][0-9]*' }
    methods: [GET, POST]
phpbb2plus_downloads_delete:
    path: /downloads/file/{file}/delete
    defaults: { _controller: phpbb2plus.downloads.submissions_controller:remove }
    requirements: { file: '[1-9][0-9]*' }
    methods: [GET, POST]
phpbb2plus_downloads_review:
    path: /downloads/file/{file}/review/{action}
    defaults: { _controller: phpbb2plus.downloads.submissions_controller:review }
    requirements: { file: '[1-9][0-9]*', action: 'approve|withdraw|reject' }
    methods: [GET, POST]
phpbb2plus_downloads_category:
    path: /downloads/category/{category}
    defaults: { _controller: phpbb2plus.downloads.catalogue_controller:view }
    requirements: { category: '[1-9][0-9]*' }
    methods: [GET, HEAD, POST]
phpbb2plus_downloads_file:
    path: /downloads/file/{file}
    defaults: { _controller: phpbb2plus.downloads.library:file }
    requirements: { file: '[1-9][0-9]*' }
    methods: [GET, HEAD]
phpbb2plus_downloads_choose:
    path: /downloads/file/{file}/download
    defaults: { _controller: phpbb2plus.downloads.delivery:choose }
    requirements: { file: '[1-9][0-9]*' }
    methods: [GET, HEAD]
phpbb2plus_downloads_recommend:
    path: /downloads/file/{file}/recommend
    defaults: { _controller: phpbb2plus.downloads.recommend_controller:view }
    requirements: { file: '[1-9][0-9]*' }
    methods: [GET, HEAD, POST]
phpbb2plus_downloads_media:
    path: /downloads/file/{file}/get/{mirror}
    defaults: { _controller: phpbb2plus.downloads.delivery:download, mirror: 0 }
    requirements: { file: '[1-9][0-9]*', mirror: '0|[1-9][0-9]*' }
    methods: [GET, HEAD, POST]
phpbb2plus_downloads_preview:
    path: /downloads/file/{file}/preview
    defaults: { _controller: phpbb2plus.downloads.delivery:preview }
    requirements: { file: '[1-9][0-9]*' }
    methods: [GET, HEAD]
phpbb2plus_downloads_feedback:
    path: /downloads/file/{file}/{operation}
    defaults: { _controller: phpbb2plus.downloads.actions:publish }
    requirements: { file: '[1-9][0-9]*', operation: 'rate|comment' }
    methods: [POST]
phpbb2plus_downloads_remove:
    path: /downloads/file/{file}/comment/{comment}/delete
    defaults: { _controller: phpbb2plus.downloads.actions:remove }
    requirements: { file: '[1-9][0-9]*', comment: '[1-9][0-9]*' }
    methods: [GET, POST]
