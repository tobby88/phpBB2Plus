<!-- INCLUDE overall_header.html -->
<h2>{L_WL_SUBMIT}</h2>
{% if WL_DONE %}<div class="panel"><p>{{ WL_DONE|e }}</p>{% if WL_NOTICE_ERROR %}<p>{L_WL_NOTICE_ERROR}</p>{% endif %}</div>
{% else %}<form id="wl-submit" method="post" action="{U_WL_SUBMIT}" class="panel">
{% if WL_ERROR %}<p class="error">{{ WL_ERROR|e }}</p>{% endif %}
<fieldset class="fields2">
<dl><dt><label for="wl-cat">{L_WL_CATEGORY}</label></dt><dd><select id="wl-cat" name="cat_id" required>{% for c in loops.wl_categories %}<option value="{{ c.ID }}"{% if c.SELECTED %} selected{% endif %}>{{ c.TITLE|e }}</option>{% endfor %}</select></dd></dl>
<dl><dt><label for="wl-title">{L_WL_NAME}</label></dt><dd><input class="inputbox" id="wl-title" name="title" value="{{ WL_FORM.title|e('html_attr') }}" maxlength="100" required></dd></dl>
<dl><dt><label for="wl-desc">{L_WL_DESCRIPTION}</label></dt><dd><textarea class="inputbox" id="wl-desc" name="description" maxlength="255" required>{{ WL_FORM.description|e }}</textarea></dd></dl>
<dl><dt><label for="wl-url">{L_WL_URL}</label></dt><dd><input class="inputbox" id="wl-url" name="destination" type="url" maxlength="100" value="{{ WL_FORM.destination|e('html_attr') }}" required></dd></dl>
<dl><dt><label for="wl-logo">{L_WL_LOGO}</label></dt><dd><input class="inputbox" id="wl-logo" name="logo" type="url" maxlength="120" value="{{ WL_FORM.logo|e('html_attr') }}"{% if WL_LOGO_REQUIRED %} required{% endif %}>
<button class="button2" name="preview" value="1" formnovalidate>{L_PREVIEW}</button>
{% if WL_PREVIEW %}<img src="{{ WL_PREVIEW|e('html_attr') }}" alt="{L_PREVIEW}" referrerpolicy="no-referrer" style="max-width:200px;max-height:100px">{% endif %}</dd></dl>
</fieldset><fieldset class="submit-buttons">{S_FORM_TOKEN}<button class="button1" type="submit" name="submit" value="1">{L_SUBMIT}</button></fieldset></form>{% endif %}
<p><a href="{U_WL}">{L_WL_TITLE}</a></p>
<!-- INCLUDE overall_footer.html -->
